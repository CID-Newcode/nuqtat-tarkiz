      function fitAndCenterCropperCanvas(prevBoxRel = null) {
        if (!cropperInstance) return;
        const container = cropperInstance.getContainerData();
        const imageData = cropperInstance.getImageData();
        if (!container || !imageData || !imageData.naturalWidth || !imageData.naturalHeight) return;

        const normRot = ((imageData.rotate % 360) + 360) % 360;
        const swap = normRot === 90 || normRot === 270;
        const effNatW = swap ? imageData.naturalHeight : imageData.naturalWidth;
        const effNatH = swap ? imageData.naturalWidth : imageData.naturalHeight;

        const fitRatio = Math.min(container.width / effNatW, container.height / effNatH);
        const fittedW = Math.max(20, effNatW * fitRatio);
        const fittedH = Math.max(20, effNatH * fitRatio);
        const fittedLeft = (container.width - fittedW) / 2;
        const fittedTop = (container.height - fittedH) / 2;

        cropperInstance.setCanvasData({
          left: fittedLeft,
          top: fittedTop,
          width: fittedW,
          height: fittedH
        });

        const minSide = Math.min(48, fittedW, fittedH);
        const maxSide = Math.max(minSide, Math.min(fittedW, fittedH));

        if (prevBoxRel) {
          const nextSize = Math.min(maxSide, Math.max(minSide, prevBoxRel.sizeNorm * maxSide));
          const leftOffsetNorm = Math.max(0, Math.min(1 - prevBoxRel.sizeNorm, prevBoxRel.leftNorm));
          const topOffsetNorm = Math.max(0, Math.min(1 - prevBoxRel.sizeNorm, prevBoxRel.topNorm));
          let nextLeft = fittedLeft + leftOffsetNorm * fittedW;
          let nextTop = fittedTop + topOffsetNorm * fittedH;
          nextLeft = Math.max(fittedLeft, Math.min(nextLeft, fittedLeft + fittedW - nextSize));
          nextTop = Math.max(fittedTop, Math.min(nextTop, fittedTop + fittedH - nextSize));
          cropperInstance.setCropBoxData({
            left: nextLeft,
            top: nextTop,
            width: nextSize,
            height: nextSize
          });
        } else {
          const initSize = Math.max(minSide, Math.round(maxSide * 0.85));
          cropperInstance.setCropBoxData({
            left: Math.round(fittedLeft + (fittedW - initSize) / 2),
            top: Math.round(fittedTop + (fittedH - initSize) / 2),
            width: initSize,
            height: initSize
          });
        }
      }

      function lockCropperMinZoomAndBounds() {
        if (!cropperInstance) return;
        const container = cropperInstance.getContainerData();
        const imageData = cropperInstance.getImageData();
        let canvasData = cropperInstance.getCanvasData();
        if (!container || !imageData || !canvasData || !imageData.naturalWidth || !imageData.naturalHeight) return;

        const normRot = ((imageData.rotate % 360) + 360) % 360;
        const swap = normRot === 90 || normRot === 270;
        const effNatW = swap ? imageData.naturalHeight : imageData.naturalWidth;
        const effNatH = swap ? imageData.naturalWidth : imageData.naturalHeight;

        const fitRatio = Math.min(container.width / effNatW, container.height / effNatH);
        const minWidth = Math.max(20, effNatW * fitRatio);
        const minHeight = Math.max(20, effNatH * fitRatio);

        if (canvasData.width < minWidth - 0.5 || canvasData.height < minHeight - 0.5) {
          const nextLeft = (container.width - minWidth) / 2;
          const nextTop = (container.height - minHeight) / 2;
          cropperInstance.setCanvasData({
            left: nextLeft,
            top: nextTop,
            width: minWidth,
            height: minHeight
          });
          canvasData = cropperInstance.getCanvasData();
        }

        const boxData = cropperInstance.getCropBoxData();
        if (boxData && canvasData && canvasData.width > 0 && canvasData.height > 0) {
          const minSide = Math.min(48, canvasData.width, canvasData.height);
          const maxSide = Math.max(minSide, Math.min(canvasData.width, canvasData.height));
          let nextW = Math.min(maxSide, Math.max(minSide, boxData.width));
          let nextH = nextW;
          let nextL = Math.max(canvasData.left, Math.min(boxData.left, canvasData.left + canvasData.width - nextW));
          let nextT = Math.max(canvasData.top, Math.min(boxData.top, canvasData.top + canvasData.height - nextH));

          if (
            Math.abs(nextW - boxData.width) > 0.5 ||
            Math.abs(nextL - boxData.left) > 0.5 ||
            Math.abs(nextT - boxData.top) > 0.5
          ) {
            cropperInstance.setCropBoxData({
              left: nextL,
              top: nextT,
              width: nextW,
              height: nextH
            });
          }
        }
      }

      function syncCircularGuideToCropBox() {
        if (!els.cropModalBackdrop.classList.contains('open')) return;

        if (cropperInstance) {
          lockCropperMinZoomAndBounds();
          const box = cropperInstance.getCropBoxData();
          const container = cropperInstance.getContainerData();
          if (box && container && box.width > 0 && box.height > 0) {
            const stageRect = els.cropStage.getBoundingClientRect();
            const containerRect = cropperInstance.cropper
              ? cropperInstance.cropper.getBoundingClientRect()
              : stageRect;
            const offsetX = containerRect.left - stageRect.left;
            const offsetY = containerRect.top - stageRect.top;
            const side = Math.min(box.width, box.height);
            const centerX = offsetX + box.left + box.width / 2;
            const centerY = offsetY + box.top + box.height / 2;
            positionCircleRing(centerX, centerY, side);
            return;
          }
        }

        if (fallbackCropImage && els.cropFallbackCanvas.style.display !== 'none') {
          const stageRect = els.cropStage.getBoundingClientRect();
          const canvasRect = els.cropFallbackCanvas.getBoundingClientRect();
          if (canvasRect.width > 0 && canvasRect.height > 0) {
            const scaleX = canvasRect.width / Math.max(1, els.cropFallbackCanvas.width);
            const scaleY = canvasRect.height / Math.max(1, els.cropFallbackCanvas.height);
            const centerX = (canvasRect.left - stageRect.left) + (fallbackBounds.left + fallbackBox.x + fallbackBox.size / 2) * scaleX;
            const centerY = (canvasRect.top - stageRect.top) + (fallbackBounds.top + fallbackBox.y + fallbackBox.size / 2) * scaleY;
            positionCircleRing(centerX, centerY, fallbackBox.size * Math.min(scaleX, scaleY));
          }
        }
      }

      function scheduleCircularGuideSync() {
        if (cropSyncRaf) cancelAnimationFrame(cropSyncRaf);
        cropSyncRaf = requestAnimationFrame(() => {
          cropSyncRaf = null;
          syncCircularGuideToCropBox();
        });
      }

      function destroyCropperInstance() {
        if (cropSyncRaf) {
          cancelAnimationFrame(cropSyncRaf);
          cropSyncRaf = null;
        }
        if (cropperInstance) {
          try {
            cropperInstance.destroy();
          } catch (_) {}
          cropperInstance = null;
        }
        els.cropCircleGuide.classList.remove('active');
      }

      function computeFallbackImageBounds(canvasW, canvasH) {
        if (!fallbackCropImage) {
          return { left: 0, top: 0, width: canvasW, height: canvasH };
        }
        const normRot = ((fallbackRotation % 360) + 360) % 360;
        const swapDims = normRot === 90 || normRot === 270;
        const srcW = swapDims ? fallbackCropImage.naturalHeight : fallbackCropImage.naturalWidth;
        const srcH = swapDims ? fallbackCropImage.naturalWidth : fallbackCropImage.naturalHeight;
        const aspect = srcW / Math.max(1, srcH);

        let drawW = canvasW;
        let drawH = canvasH;
        if (aspect >= 1) {
          drawW = canvasW;
          drawH = Math.max(48, Math.round(canvasW / aspect));
        } else {
          drawH = canvasH;
          drawW = Math.max(48, Math.round(canvasH * aspect));
        }

        const left = Math.round((canvasW - drawW) / 2);
        const top = Math.round((canvasH - drawH) / 2);
        return { left, top, width: drawW, height: drawH };
      }

      function mapBoxAcrossRotation(prevBox, prevBounds, nextBounds, deg) {
        const normDeg = ((deg % 360) + 360) % 360;
        const prevW = Math.max(1, prevBounds.width);
        const prevH = Math.max(1, prevBounds.height);
        const nextW = Math.max(1, nextBounds.width);
        const nextH = Math.max(1, nextBounds.height);

        const prevMax = Math.max(1, Math.min(prevW, prevH));
        const nextMax = Math.max(1, Math.min(nextW, nextH));
        const minSide = Math.min(48, nextW, nextH);
        const sizeNorm = prevBox.size / prevMax;
        const nextSize = Math.min(nextMax, Math.max(minSide, sizeNorm * nextMax));

        const u0 = prevBox.x / prevW;
        const v0 = prevBox.y / prevH;
        const u1 = (prevBox.x + prevBox.size) / prevW;
        const v1 = (prevBox.y + prevBox.size) / prevH;

        let nu0 = u0;
        let nv0 = v0;
        let nu1 = u1;
        let nv1 = v1;

        if (normDeg === 90) {
          nu0 = 1 - v1;
          nv0 = u0;
          nu1 = 1 - v0;
          nv1 = u1;
        } else if (normDeg === 270) {
          nu0 = v0;
          nv0 = 1 - u1;
          nu1 = v1;
          nv1 = 1 - u0;
        }

        const mappedX = Math.min(nu0, nu1) * nextW;
        const mappedY = Math.min(nv0, nv1) * nextH;

        return {
          x: Math.max(0, Math.min(mappedX, nextW - nextSize)),
          y: Math.max(0, Math.min(mappedY, nextH - nextSize)),
          size: nextSize
        };
      }

      function renderOfflineCanvasView(resetBox = false, rotationDelta = 0) {
        if (!fallbackCropImage) return;
        const canvas = els.cropFallbackCanvas;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const prevBoxSnapshot = { ...fallbackBox };
        const prevBoundsSnapshot = { ...fallbackBounds };

        const stageRect = els.cropStage.getBoundingClientRect();
        const side = Math.min(360, Math.max(220, Math.floor(Math.min(stageRect.width || 340, stageRect.height || 340) * 0.86)));
        canvas.width = side;
        canvas.height = side;

        const bounds = computeFallbackImageBounds(side, side);
        fallbackBounds = bounds;

        const minBox = Math.min(48, bounds.width, bounds.height);
        const maxBox = Math.max(minBox, Math.min(bounds.width, bounds.height));

        if (resetBox || prevBoxSnapshot.size <= 0) {
          const initSize = Math.max(minBox, Math.round(maxBox * 0.85));
          fallbackBox = {
            size: initSize,
            x: Math.round((bounds.width - initSize) / 2),
            y: Math.round((bounds.height - initSize) / 2)
          };
        } else if (rotationDelta !== 0) {
          fallbackBox = mapBoxAcrossRotation(prevBoxSnapshot, prevBoundsSnapshot, bounds, rotationDelta);
        } else {
          const nextSize = Math.min(maxBox, Math.max(minBox, prevBoxSnapshot.size));
          fallbackBox = {
            size: nextSize,
            x: Math.max(0, Math.min(prevBoxSnapshot.x, bounds.width - nextSize)),
            y: Math.max(0, Math.min(prevBoxSnapshot.y, bounds.height - nextSize))
          };
        }

        ctx.clearRect(0, 0, side, side);

        ctx.save();
        ctx.translate(side / 2, side / 2);
        ctx.rotate((fallbackRotation * Math.PI) / 180);
        const normRot = ((fallbackRotation % 360) + 360) % 360;
        const swapDims = normRot === 90 || normRot === 270;
        const rotW = swapDims ? bounds.height : bounds.width;
        const rotH = swapDims ? bounds.width : bounds.height;
        ctx.drawImage(fallbackCropImage, -rotW / 2, -rotH / 2, rotW, rotH);
        ctx.restore();

        const bx = bounds.left + fallbackBox.x;
        const by = bounds.top + fallbackBox.y;
        const bs = fallbackBox.size;

        const accentColor = getCssVar('--accent', '#38bdf8');
        const cardColor = getCssVar('--bg-card', '#131e30');

        ctx.save();
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bs, bs);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.42)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx + bs / 3, by);
        ctx.lineTo(bx + bs / 3, by + bs);
        ctx.moveTo(bx + (2 * bs) / 3, by);
        ctx.lineTo(bx + (2 * bs) / 3, by + bs);
        ctx.moveTo(bx, by + bs / 3);
        ctx.lineTo(bx + bs, by + bs / 3);
        ctx.moveTo(bx, by + (2 * bs) / 3);
        ctx.lineTo(bx + bs, by + (2 * bs) / 3);
        ctx.stroke();

        const hSize = 12;
        const corners = [
          [bx, by],
          [bx + bs, by],
          [bx, by + bs],
          [bx + bs, by + bs]
        ];
        corners.forEach(([cx, cy]) => {
          ctx.fillStyle = accentColor;
          ctx.strokeStyle = cardColor;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(cx - hSize / 2, cy - hSize / 2, hSize, hSize, 2);
          ctx.fill();
          ctx.stroke();
        });
        ctx.restore();

        scheduleCircularGuideSync();
      }

      function resetFallbackTransform() {
        fallbackRotation = 0;
        renderOfflineCanvasView(true, 0);
      }

      function openCropModalWithFile(file) {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result);
          destroyCropperInstance();

      function closeCropModalOnly(fromPopstate = false) {
        destroyCropperInstance();
        fallbackCropImage = null;
        fallbackAction = null;
        els.cropSourceImg.onload = null;
        els.cropSourceImg.removeAttribute('src');

          popLayerHistorySilent('crop');

      function getCropperRotatedBoxRel(deg) {
        if (!cropperInstance) return null;
        const canvasData = cropperInstance.getCanvasData();
        const boxData = cropperInstance.getCropBoxData();
        if (!canvasData || !boxData || canvasData.width <= 0 || canvasData.height <= 0) return null;

        const normDeg = ((deg % 360) + 360) % 360;
        const maxSide = Math.max(1, Math.min(canvasData.width, canvasData.height));
        const sizeNorm = Math.min(boxData.width, boxData.height) / maxSide;

        const u0 = (boxData.left - canvasData.left) / canvasData.width;
        const v0 = (boxData.top - canvasData.top) / canvasData.height;
        const u1 = (boxData.left + boxData.width - canvasData.left) / canvasData.width;
        const v1 = (boxData.top + boxData.height - canvasData.top) / canvasData.height;

        let nu0 = u0;
        let nv0 = v0;
        let nu1 = u1;
        let nv1 = v1;

        if (normDeg === 90) {
          nu0 = 1 - v1;
          nv0 = u0;
          nu1 = 1 - v0;
          nv1 = u1;
        } else if (normDeg === 270) {
          nu0 = v0;
          nv0 = 1 - u1;
          nu1 = v1;
          nv1 = 1 - u0;
        }

        return {
          leftNorm: Math.min(nu0, nu1),
          topNorm: Math.min(nv0, nv1),
          sizeNorm
        };
      }

      function rotateCropperBy(deg) {
        if (cropperInstance) {
          const nextRel = getCropperRotatedBoxRel(deg);
          cropperInstance.rotate(deg);
          fitAndCenterCropperCanvas(nextRel);
          scheduleCircularGuideSync();
        } else if (fallbackCropImage) {
          fallbackRotation = (((fallbackRotation + deg) % 360) + 360) % 360;
          renderOfflineCanvasView(false, deg);
        }
      }

      function resetCropperView() {
        if (cropperInstance) {
          cropperInstance.reset();
          fitAndCenterCropperCanvas(null);
          scheduleCircularGuideSync();
        } else if (fallbackCropImage) {
          resetFallbackTransform();
        }
      }

      function exportCroppedAvatar300() {
        if (cropperInstance) {
          const canvas = cropperInstance.getCroppedCanvas({
            width: 300,
            height: 300,
            imageSmoothingQuality: 'high'
          });
          if (canvas) {
            return canvas.toDataURL('image/jpeg', 0.88);
          }
        }

        if (fallbackCropImage) {
          const side = els.cropFallbackCanvas.width || 300;
          const off = document.createElement('canvas');
          off.width = side;
          off.height = side;
          const octx = off.getContext('2d');
          if (octx) {
            octx.imageSmoothingQuality = 'high';
            octx.translate(side / 2, side / 2);
            octx.rotate((fallbackRotation * Math.PI) / 180);
            const normRot = ((fallbackRotation % 360) + 360) % 360;
            const swapDims = normRot === 90 || normRot === 270;
            const rotW = swapDims ? fallbackBounds.height : fallbackBounds.width;
            const rotH = swapDims ? fallbackBounds.width : fallbackBounds.height;
            octx.drawImage(fallbackCropImage, -rotW / 2, -rotH / 2, rotW, rotH);
          }

          const out = document.createElement('canvas');
          out.width = 300;
          out.height = 300;
          const ctx = out.getContext('2d');
          if (ctx) {
            ctx.imageSmoothingQuality = 'high';
            const sx = fallbackBounds.left + fallbackBox.x;
            const sy = fallbackBounds.top + fallbackBox.y;
            const sw = fallbackBox.size;
            ctx.drawImage(off, sx, sy, sw, sw, 0, 0, 300, 300);
            return out.toDataURL('image/jpeg', 0.88);
          }
        }

        return '';
      }

      function detectFallbackHitZone(px, py) {
        const bx = fallbackBounds.left + fallbackBox.x;
        const by = fallbackBounds.top + fallbackBox.y;
        const bs = fallbackBox.size;
        const tol = 18;

        const nearLeft = Math.abs(px - bx) <= tol;
        const nearRight = Math.abs(px - (bx + bs)) <= tol;
        const nearTop = Math.abs(py - by) <= tol;
        const nearBottom = Math.abs(py - (by + bs)) <= tol;

        if (nearTop && nearLeft) return 'nw';
        if (nearTop && nearRight) return 'ne';
        if (nearBottom && nearLeft) return 'sw';
        if (nearBottom && nearRight) return 'se';
        if (nearTop && px >= bx - tol && px <= bx + bs + tol) return 'n';
        if (nearBottom && px >= bx - tol && px <= bx + bs + tol) return 's';
        if (nearLeft && py >= by - tol && py <= by + bs + tol) return 'w';
        if (nearRight && py >= by - tol && py <= by + bs + tol) return 'e';
        if (px >= bx && px <= bx + bs && py >= by && py <= by + bs) return 'move';
        return null;
      }

      els.cropFallbackCanvas.addEventListener('pointerdown', (e) => {
        if (!fallbackCropImage || cropperInstance) return;
        const rect = els.cropFallbackCanvas.getBoundingClientRect();
        const scaleX = (els.cropFallbackCanvas.width || rect.width) / Math.max(1, rect.width);
        const scaleY = (els.cropFallbackCanvas.height || rect.height) / Math.max(1, rect.height);
        const px = (e.clientX - rect.left) * scaleX;
        const py = (e.clientY - rect.top) * scaleY;

        const zone = detectFallbackHitZone(px, py);
        if (!zone) return;

        fallbackAction = zone;
        fallbackPointerStart = {
          x: px,
          y: py,
          box: { ...fallbackBox }
        };
        try {
          els.cropFallbackCanvas.setPointerCapture(e.pointerId);
        } catch (_) {}
      });

      els.cropFallbackCanvas.addEventListener('pointermove', (e) => {
        if (!fallbackAction || !fallbackCropImage || cropperInstance || !fallbackPointerStart.box) return;
        const rect = els.cropFallbackCanvas.getBoundingClientRect();
        const scaleX = (els.cropFallbackCanvas.width || rect.width) / Math.max(1, rect.width);
        const scaleY = (els.cropFallbackCanvas.height || rect.height) / Math.max(1, rect.height);
        const px = (e.clientX - rect.left) * scaleX;
        const py = (e.clientY - rect.top) * scaleY;

        const dx = px - fallbackPointerStart.x;
        const dy = py - fallbackPointerStart.y;
        const startBox = fallbackPointerStart.box;
        const minSide = Math.min(48, fallbackBounds.width, fallbackBounds.height);
        const maxSide = Math.max(minSide, Math.min(fallbackBounds.width, fallbackBounds.height));

        if (fallbackAction === 'move') {
          fallbackBox.x = Math.max(0, Math.min(startBox.x + dx, fallbackBounds.width - startBox.size));
          fallbackBox.y = Math.max(0, Math.min(startBox.y + dy, fallbackBounds.height - startBox.size));
        } else {
          let delta = 0;
          if (fallbackAction === 'se') delta = Math.max(dx, dy);
          else if (fallbackAction === 'nw') delta = Math.max(-dx, -dy);
          else if (fallbackAction === 'ne') delta = Math.max(dx, -dy);
          else if (fallbackAction === 'sw') delta = Math.max(-dx, dy);
          else if (fallbackAction === 'e') delta = dx;
          else if (fallbackAction === 'w') delta = -dx;
          else if (fallbackAction === 's') delta = dy;
          else if (fallbackAction === 'n') delta = -dy;

          const nextSize = Math.min(maxSide, Math.max(minSide, startBox.size + delta));
          let nextX = startBox.x;
          let nextY = startBox.y;

          if (fallbackAction.includes('w')) {
            nextX = startBox.x + (startBox.size - nextSize);
          }
          if (fallbackAction.includes('n')) {
            nextY = startBox.y + (startBox.size - nextSize);
          }

          nextX = Math.max(0, Math.min(nextX, fallbackBounds.width - nextSize));
          nextY = Math.max(0, Math.min(nextY, fallbackBounds.height - nextSize));

          fallbackBox = { x: nextX, y: nextY, size: nextSize };
        }

        renderOfflineCanvasView(false, 0);
      });

      const endFallbackAction = () => {
        fallbackAction = null;
        fallbackPointerStart = { x: 0, y: 0, box: null };
      };
      els.cropFallbackCanvas.addEventListener('pointerup', endFallbackAction);
      els.cropFallbackCanvas.addEventListener('pointercancel', endFallbackAction);

      /* Clean App Share (no user data) for Offline Mode */
      function buildCleanAppHtml() {
        const clone = document.documentElement.cloneNode(true);
        clone.setAttribute('data-theme', 'navy');
        clone.setAttribute('lang', 'ar');
        clone.setAttribute('dir', 'rtl');

        const metaTheme = clone.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', '#0b1320');

        const welcomeOverlay = clone.querySelector('#softWelcomeOverlay');
        if (welcomeOverlay) welcomeOverlay.classList.remove('open');

        const slots = clone.querySelectorAll('.slot-pill-btn');
        slots.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.slots === '1');
        });

        const backdrop = clone.querySelector('#drawerBackdrop');
        if (backdrop) backdrop.classList.remove('open');

        const drawer = clone.querySelector('#drawerMenu');
        if (drawer) drawer.classList.remove('open');

        const hamb = clone.querySelector('#hamburgerBtn');
        if (hamb) {
          hamb.classList.remove('is-open');
          hamb.setAttribute('aria-expanded', 'false');
        }

        const vault = clone.querySelector('#vaultBackdrop');
        if (vault) vault.classList.remove('open');

        const crop = clone.querySelector('#cropModalBackdrop');
        if (crop) crop.classList.remove('open');

        const guide = clone.querySelector('#cropCircleGuide');
        if (guide) guide.classList.remove('active');

        const exp = clone.querySelector('#exportModalBackdrop');
        if (exp) exp.classList.remove('open');

        const avatarCircle = clone.querySelector('#avatarCircle');
        if (avatarCircle) avatarCircle.textContent = 'ن';

        const removeBtn = clone.querySelector('#removeAvatarBtn');
        if (removeBtn) {
          removeBtn.style.display = 'none';
          removeBtn.classList.remove('is-confirming');
        }

        const nameInput = clone.querySelector('#profileNameInput');
        if (nameInput) nameInput.removeAttribute('value');

        const statusMsg = clone.querySelector('#backupStatusMsg');
        if (statusMsg) {
          statusMsg.textContent = '';
          statusMsg.classList.remove('visible', 'error');
        }

        return '<!DOCTYPE html>\n' + clone.outerHTML;
      }

      function downloadCleanHtmlFile() {
        const htmlContent = buildCleanAppHtml();
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'nuqtat-tarkiz.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function copyUrlToClipboard(urlStr) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(urlStr);
          return true;
        }
        const helper = document.createElement('textarea');
        helper.value = urlStr;
        helper.style.position = 'fixed';
        helper.style.opacity = '0';
        document.body.appendChild(helper);
        helper.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(helper);
        return ok;
      }

      async function shareCurrentApp() {
        const isHttpOrigin = typeof window.location.protocol === 'string' && window.location.protocol.startsWith('http');

        if (isHttpOrigin) {
          const shareUrl = window.location.href;
          try {
            if (typeof navigator.share === 'function') {
              await navigator.share({
                title: t('drawerBrandTitle'),
                text: 'Nuqtat Tarkiz — Anti-Overwhelm Focus',
                url: shareUrl
              });
              showCalmToast(t('shareLinkSuccessMsg'));
              return;
            }
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }

          try {
            const copied = await copyUrlToClipboard(shareUrl);
            if (copied) {
              showCalmToast(t('shareLinkCopiedMsg'));
              return;
            }
          } catch (_) {}

          showBackupNotice(t('shareFailedMsg'), true);
          return;
        }

        try {
          const htmlContent = buildCleanAppHtml();
          const file = new File([htmlContent], 'nuqtat-tarkiz.html', { type: 'text/html' });

          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: t('drawerBrandTitle'),
              text: 'Anti-Overwhelm Focus',
              files: [file]
            });
            showBackupNotice(t('shareSuccessMsg'), false);
            return;
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }

        try {
          downloadCleanHtmlFile();
          showBackupNotice(t('shareFallbackDownloadedMsg'), false);
        } catch (_) {
          showBackupNotice(t('shareFailedMsg'), true);
        }
      }

      function triggerDirectJsonDownload(fileBaseName, jsonStr) {
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${fileBaseName}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showBackupNotice(t('exportSuccessMsg'), false);
      }

      async function saveBackupWithSystemPicker(fileBaseName) {
        const jsonStr = buildTasksBackupJson();
        const fileName = `${fileBaseName}.json`;

        if (typeof window.showSaveFilePicker === 'function') {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: fileName,
              types: [
                {
                  description: 'JSON Backup File',
                  accept: { 'application/json': ['.json'] }
                }
              ]
            });
            const writable = await handle.createWritable();
            await writable.write(jsonStr);
            await writable.close();
            showBackupNotice(t('exportSuccessMsg'), false);
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') {
              return;
            }
          }
        }

        triggerDirectJsonDownload(fileBaseName, jsonStr);
      }

      function importBackupFromFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onerror = () => showBackupNotice(t('importInvalidMsg'), true);
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            const rawData = parsed && typeof parsed === 'object' && parsed.data && typeof parsed.data === 'object'
              ? parsed.data
              : parsed;

            if (!rawData || typeof rawData !== 'object' || (!Array.isArray(rawData.queue) && !Array.isArray(rawData.completed) && !Array.isArray(rawData.slots) && !Array.isArray(rawData.activeAssignments))) {
              showBackupNotice(t('importInvalidMsg'), true);
              return;
            }

            state.queue = normalizeQueueList(rawData.queue);
            state.completed = normalizeCompletedList(rawData.completed);
            if ([1, 2, 3].includes(Number(rawData.slotCount))) {
              state.slotCount = Number(rawData.slotCount);
            }
            const importedSlots = extractThreeSlots(rawData);
            state.slots = importedSlots.slice();
            state.activeAssignments = importedSlots.slice();
            const rawResting = Array.isArray(rawData.restingSlots) ? rawData.restingSlots : [false, false, false];
            state.restingSlots = [Boolean(rawResting[0]), Boolean(rawResting[1]), Boolean(rawResting[2])];

            pendingDeleteQueueId = null;
            pendingDeleteCompletedId = null;
            confirmClearHistory = false;
            syncFocusSlots();
            renderAll(false);
            showBackupNotice(t('importSuccessMsg'), false);
          } catch (_) {
            showBackupNotice(t('importInvalidMsg'), true);
          }
        };
        reader.readAsText(file);
      }

      function attachLongPressReorder(cardEl, slotIndex) {
        if (state.slotCount <= 1) return;

        let pressTimer = null;
        let startX = 0;
        let startY = 0;

        const clearTimer = () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        };

        cardEl.addEventListener('pointerdown', (e) => {
          if (e.target.closest('button') || e.target.closest('.card-reorder-popover')) return;
          if (e.button !== undefined && e.button !== 0) return;

          startX = e.clientX;
          startY = e.clientY;
          clearTimer();

          pressTimer = setTimeout(() => {
            openReorderSlot = slotIndex;
            renderFocusStage(false);
          }, 500);
        });

        cardEl.addEventListener('pointermove', (e) => {
          if (!pressTimer) return;
          if (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12) {
            clearTimer();
          }
        });

        cardEl.addEventListener('pointerup', clearTimer);
        cardEl.addEventListener('pointercancel', clearTimer);
        cardEl.addEventListener('contextmenu', (e) => {
          if (state.slotCount > 1 && !e.target.closest('button')) {
            e.preventDefault();
          }
        });
      }

      function renderFocusStage(animateEntrance = false) {
        els.focusStage.innerHTML = '';
        const queueMap = new Map(state.queue.map(item => [item.id, item]));
        const allAssignedIds = new Set(state.slots.filter(Boolean));
        const unpulledTasksExist = state.queue.some(task => !allAssignedIds.has(task.id));
        const vaultQueueCompletelyEmpty = state.queue.length === 0 && allAssignedIds.size === 0;

        for (let i = 0; i < state.slotCount; i++) {
          const taskId = state.slots[i];
          const task = taskId ? queueMap.get(taskId) : null;

          if (task) {
            const status = getTaskStatus(task);
            const card = document.createElement('article');
            card.className = 'focus-card' + (animateEntrance ? ' animate-enter' : '');
            if (status.isOverdue) card.classList.add('is-overdue');
            else if (status.isMandatory) card.classList.add('is-mandatory');

            if (state.slotCount > 1 && openReorderSlot === i) {
              const popover = document.createElement('div');
              popover.className = 'card-reorder-popover';

              const lbl = document.createElement('span');
              lbl.className = 'popover-label';
              lbl.textContent = t('moveToLabel');
              popover.appendChild(lbl);

              for (let pos = 0; pos < state.slotCount; pos++) {
                const posBtn = document.createElement('button');
                posBtn.type = 'button';
                posBtn.className = 'pos-choice-btn' + (pos === i ? ' current-pos' : '');
                posBtn.textContent = String(pos + 1);
                posBtn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  swapFocusSlotPositions(i, pos);
                });
                popover.appendChild(posBtn);
              }
              card.appendChild(popover);
            }

            const hasBadges = status.isMandatory || Boolean(task.deadline);
            if (hasBadges) {
              const badgesRow = document.createElement('div');
              badgesRow.className = 'card-badges';

              if (status.isMandatory) {
                const mBadge = document.createElement('span');
                mBadge.className = 'badge badge-mandatory';
                mBadge.textContent = status.isTimedMandatory
                  ? t('mandatoryTimedBadge')
                  : t('mandatoryManualBadge');
                badgesRow.appendChild(mBadge);
              }

              if (task.deadline) {
                const dBadge = document.createElement('span');
                dBadge.className = 'badge badge-deadline';
                if (status.isOverdue) {
                  dBadge.classList.add('overdue');
                  dBadge.textContent = `${t('deadlinePassedBadge')} ${formatDateTime(task.deadline)}`;
                } else {
                  if (status.isUrgent) dBadge.classList.add('urgent');
                  dBadge.textContent = `${t('deadlineDueBadge')} ${formatDateTime(task.deadline)}`;
                }
                badgesRow.appendChild(dBadge);
              }

              card.appendChild(badgesRow);
            }

            const titleEl = document.createElement('h1');
            titleEl.className = 'task-title';
            titleEl.setAttribute('dir', 'auto');
            titleEl.textContent = task.title;
            card.appendChild(titleEl);

            if (task.note && task.note.trim()) {
              const noteEl = document.createElement('p');
              noteEl.className = 'task-note';
              noteEl.setAttribute('dir', 'auto');
              noteEl.textContent = task.note;
              card.appendChild(noteEl);
            }

            const actionsRow = document.createElement('div');
            actionsRow.className = 'card-actions';

            const doneBtn = document.createElement('button');
            doneBtn.type = 'button';
            doneBtn.className = 'btn-done';
            doneBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span>${t('doneBtn')}</span>`;
            doneBtn.addEventListener('click', () => completeSlotTask(i));
            actionsRow.appendChild(doneBtn);

            if (!status.isMandatory) {
              const deferBtn = document.createElement('button');
              deferBtn.type = 'button';
              deferBtn.className = 'btn-defer';
              deferBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg><span>${t('deferBtn')}</span>`;
              deferBtn.addEventListener('click', () => deferSlotTask(i));
              actionsRow.appendChild(deferBtn);
            }

            card.appendChild(actionsRow);
            attachLongPressReorder(card, i);
            els.focusStage.appendChild(card);

          } else if (unpulledTasksExist) {
            const restCard = document.createElement('div');
            restCard.className = 'rest-card' + (animateEntrance ? ' animate-enter' : '');

            const headingText = state.restingSlots[i] ? t('completedMsg') : t('emptyVaultTitle');
            const subText = t('completedSubWithQueue');
            restCard.innerHTML = `
              <div class="rest-icon">
                <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
              </div>
              <p class="rest-message">${headingText}</p>
              <p class="rest-sub">${subText}</p>
            `;

            const pullBtn = document.createElement('button');
            pullBtn.type = 'button';
            pullBtn.className = 'btn-pull';
            pullBtn.textContent = t('pullNextBtn');
            pullBtn.addEventListener('click', () => pullNextForSlot(i));
            restCard.appendChild(pullBtn);

            els.focusStage.appendChild(restCard);
          } else if (vaultQueueCompletelyEmpty) {
            const restCard = document.createElement('div');
            restCard.className = 'rest-card' + (animateEntrance ? ' animate-enter' : '');

            restCard.innerHTML = `
              <div class="rest-icon">
                <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
              </div>
              <p class="rest-message">${t('completedMsg')}</p>
              <p class="rest-sub">${t('completedSubEmpty')}</p>

            const openBtn = document.createElement('button');
            openBtn.type = 'button';
            openBtn.className = 'btn-pull';
            openBtn.textContent = t('openVaultAction');
            openBtn.addEventListener('click', openVaultModal);
            restCard.appendChild(openBtn);

            els.focusStage.appendChild(restCard);
          } else {
            const emptyCard = document.createElement('div');
            emptyCard.className = 'rest-card' + (animateEntrance ? ' animate-enter' : '');

            emptyCard.innerHTML = `
              <div class="rest-icon empty-vault-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8m-4-4h8"/></svg>
              </div>
              <p class="rest-message">${t('emptyVaultTitle')}</p>
              <p class="rest-sub">${t('emptyVaultSub')}</p>

            if (i === 0) {
              const openBtn = document.createElement('button');
              openBtn.type = 'button';
              openBtn.className = 'btn-pull';
              openBtn.textContent = t('openVaultAction');
              openBtn.addEventListener('click', openVaultModal);
              emptyCard.appendChild(openBtn);
            }

            els.focusStage.appendChild(emptyCard);
          }
        }
      }

      function destroyQueueSortable() {
        if (queueSortableInstance) {
          try {
            queueSortableInstance.destroy();
          } catch (_) {}
          queueSortableInstance = null;
        }
      }

      function initQueueSortable() {
        destroyQueueSortable();
        if (typeof window.Sortable === 'undefined') return;
        if (state.queue.length < 2) return;

        queueSortableInstance = window.Sortable.create(els.queueList, {
          handle: '.drag-handle',
          animation: 150,
          ghostClass: 'sortable-ghost-calm',
          chosenClass: 'sortable-chosen-calm',
          scroll: els.vaultBody,
          scrollSensitivity: 60,
          scrollSpeed: 10,
          forceFallback: false,
          onEnd: (evt) => {
            const oldIdx = evt.oldIndex;
            const newIdx = evt.newIndex;
            if (
              typeof oldIdx !== 'number' ||
              typeof newIdx !== 'number' ||
              oldIdx === newIdx ||
              oldIdx < 0 ||
              newIdx < 0 ||
              oldIdx >= state.queue.length ||
              newIdx >= state.queue.length
            ) {
              renderVaultLists();
              return;
            }

            const [movedTask] = state.queue.splice(oldIdx, 1);
            state.queue.splice(newIdx, 0, movedTask);
            syncFocusSlotsToQueueOrder();
            renderFocusStage(false);
            renderVaultLists();
          }
        });
      }

            controls.appendChild(editBtn);

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'ctrl-btn danger';
            delBtn.setAttribute('aria-label', t('deleteAria'));
            delBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;
            delBtn.addEventListener('click', () => {
              pendingDeleteCompletedId = null;
              confirmClearHistory = false;
              pendingDeleteQueueId = pendingDeleteQueueId === task.id ? null : task.id;
              renderVaultLists();
            });
            controls.appendChild(delBtn);

            topRow.appendChild(controls);
            item.appendChild(topRow);

            if (pendingDeleteQueueId === task.id) {
              const confirmStrip = document.createElement('div');
              confirmStrip.className = 'confirm-bar';
              confirmStrip.style.marginTop = '0.55rem';
              confirmStrip.innerHTML = `<span>${t('confirmDeleteQueueText')}</span>`;

              const actionPair = document.createElement('div');
              actionPair.style.display = 'flex';
              actionPair.style.gap = '0.45rem';

              const confirmDelBtn = document.createElement('button');
              confirmDelBtn.type = 'button';
              confirmDelBtn.className = 'btn-clear-history';
              confirmDelBtn.textContent = t('confirmYes');
              confirmDelBtn.addEventListener('click', () => {
                pendingDeleteQueueId = null;
                deleteQueueTask(task.id);
              });

              const undoBtn = document.createElement('button');
              undoBtn.type = 'button';
              undoBtn.className = 'btn-secondary';
              undoBtn.textContent = t('undoBtn');
              undoBtn.addEventListener('click', () => {
                pendingDeleteQueueId = null;
                renderVaultLists();
              });

              actionPair.appendChild(confirmDelBtn);
              actionPair.appendChild(undoBtn);
              confirmStrip.appendChild(actionPair);
              item.appendChild(confirmStrip);
            }

            els.queueList.appendChild(item);
          });

          if (pendingDeleteQueueId === null) {
            initQueueSortable();
          }
        }

        els.completedToolbar.innerHTML = '';
        els.completedList.innerHTML = '';

        if (state.completed.length > 0) {
          if (confirmClearHistory) {
            const bar = document.createElement('div');
            bar.className = 'confirm-bar';
            bar.innerHTML = `<span>${t('confirmClearText')}</span>`;

            const btns = document.createElement('div');
            btns.style.display = 'flex';
            btns.style.gap = '0.5rem';

            const yesBtn = document.createElement('button');
            yesBtn.type = 'button';
            yesBtn.className = 'btn-clear-history';
            yesBtn.textContent = t('confirmYes');
            yesBtn.addEventListener('click', () => {
              state.completed = [];
              expandedHistoryIds.clear();
              pendingDeleteCompletedId = null;
              confirmClearHistory = false;
              saveState();
              renderVaultLists();
            });

            const undoBtn = document.createElement('button');
            undoBtn.type = 'button';
            undoBtn.className = 'btn-secondary';
            undoBtn.textContent = t('undoBtn');
            undoBtn.addEventListener('click', () => {
              confirmClearHistory = false;
              renderVaultLists();
            });

            btns.appendChild(yesBtn);
            btns.appendChild(undoBtn);
            bar.appendChild(btns);
            els.completedToolbar.appendChild(bar);
          } else {
            const clearBtn = document.createElement('button');
            clearBtn.type = 'button';
            clearBtn.className = 'btn-clear-history';
            clearBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>${t('clearHistoryBtn')}</span>`;
            clearBtn.addEventListener('click', () => {
              pendingDeleteQueueId = null;
              pendingDeleteCompletedId = null;
              confirmClearHistory = true;
              renderVaultLists();
            });
            els.completedToolbar.appendChild(clearBtn);
          }
        }

        if (state.completed.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-list-msg';
          empty.textContent = t('completedEmptyMsg');
          els.completedList.appendChild(empty);
        } else {
          state.completed.forEach(task => {
            const rawLog = Array.isArray(task.completionLog) && task.completionLog.length > 0
              ? task.completionLog.slice()
              : [task.completedAt];
            const orderedLog = rawLog.sort((a, b) => new Date(a).getTime() - new Date(b).getTime());
            const latestStamp = orderedLog[orderedLog.length - 1];

            const item = document.createElement('div');
            item.className = 'list-item';
            item.style.flexDirection = 'column';
            item.style.alignItems = 'stretch';

            const topRow = document.createElement('div');
            topRow.style.display = 'flex';
            topRow.style.alignItems = 'center';
            topRow.style.gap = '0.55rem';
            topRow.style.flexWrap = 'wrap';
            topRow.style.minWidth = '0';

            const content = document.createElement('div');
            content.className = 'item-content';

            const title = document.createElement('div');
            title.className = 'item-title';
            title.setAttribute('dir', 'auto');
            title.textContent = task.title;
            content.appendChild(title);

            if (task.note && task.note.trim()) {
              const note = document.createElement('div');
              note.className = 'item-note';
              note.setAttribute('dir', 'auto');
              note.textContent = task.note;
              content.appendChild(note);
            }

            const meta = document.createElement('div');
            meta.className = 'item-meta';

            const timeTag = document.createElement('span');
            timeTag.className = 'mini-tag';
            timeTag.textContent = `${t('completedAtPrefix')} ${formatDateTime(latestStamp)}`;
            meta.appendChild(timeTag);

            if (orderedLog.length > 1) {
              const repeatBtn = document.createElement('button');
              repeatBtn.type = 'button';
              repeatBtn.className = 'repeat-badge-btn';
              repeatBtn.textContent = t('completedTimes')(orderedLog.length);
              repeatBtn.addEventListener('click', () => {
                if (expandedHistoryIds.has(task.id)) {
                  expandedHistoryIds.delete(task.id);
                } else {
                  expandedHistoryIds.add(task.id);
                }
                renderVaultLists();
              });
              meta.appendChild(repeatBtn);
            }

            content.appendChild(meta);

            if (orderedLog.length > 1 && expandedHistoryIds.has(task.id)) {
              const drawer = document.createElement('div');
              drawer.className = 'history-drawer';

              const drawerHeader = document.createElement('div');
              drawerHeader.className = 'history-drawer-title';
              drawerHeader.textContent = t('historyLogHeader');
              drawer.appendChild(drawerHeader);

              orderedLog.forEach((stamp, idx) => {
                const entry = document.createElement('div');
                entry.className = 'history-entry';
                entry.textContent = `${idx + 1}. ${formatDateTime(stamp)}`;
                drawer.appendChild(entry);
              });

              content.appendChild(drawer);
            }

            topRow.appendChild(content);

            const controls = document.createElement('div');
            controls.className = 'item-controls';

            const restoreBtn = document.createElement('button');
            restoreBtn.type = 'button';
            restoreBtn.className = 'btn-secondary';
            restoreBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg><span>${t('restoreBtn')}</span>`;
            restoreBtn.addEventListener('click', () => restoreCompletedTask(task.id));
            controls.appendChild(restoreBtn);

            const delSingleBtn = document.createElement('button');
            delSingleBtn.type = 'button';
            delSingleBtn.className = 'ctrl-btn danger';
            delSingleBtn.setAttribute('aria-label', t('deleteAria'));
            delSingleBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;
            delSingleBtn.addEventListener('click', () => {
              pendingDeleteQueueId = null;
              confirmClearHistory = false;
              pendingDeleteCompletedId = pendingDeleteCompletedId === task.id ? null : task.id;
              renderVaultLists();
            });
            controls.appendChild(delSingleBtn);

            topRow.appendChild(controls);
            item.appendChild(topRow);

            if (pendingDeleteCompletedId === task.id) {
              const confirmStrip = document.createElement('div');
              confirmStrip.className = 'confirm-bar';
              confirmStrip.style.marginTop = '0.55rem';
              confirmStrip.innerHTML = `<span>${t('confirmDeleteSingleText')}</span>`;

              const actionPair = document.createElement('div');
              actionPair.style.display = 'flex';
              actionPair.style.gap = '0.45rem';

              const confirmDelBtn = document.createElement('button');
              confirmDelBtn.type = 'button';
              confirmDelBtn.className = 'btn-clear-history';
              confirmDelBtn.textContent = t('confirmYes');
              confirmDelBtn.addEventListener('click', () => {
                pendingDeleteCompletedId = null;
                deleteCompletedTask(task.id);
              });

              const undoSingleBtn = document.createElement('button');
              undoSingleBtn.type = 'button';
              undoSingleBtn.className = 'btn-secondary';
              undoSingleBtn.textContent = t('undoBtn');
              undoSingleBtn.addEventListener('click', () => {
                pendingDeleteCompletedId = null;
                renderVaultLists();
              });

              actionPair.appendChild(confirmDelBtn);
              actionPair.appendChild(undoSingleBtn);
              confirmStrip.appendChild(actionPair);
              item.appendChild(confirmStrip);
            }

            els.completedList.appendChild(item);
          });
        }
      }

      /* =========================================
         10. STEPWISE ARROW REORDERING & VAULT CRUD
         ========================================= */
      function moveQueueItem(fromIdx, toIdx) {
        if (fromIdx === toIdx || toIdx < 0 || toIdx >= state.queue.length) return;
        const [moved] = state.queue.splice(fromIdx, 1);
        state.queue.splice(toIdx, 0, moved);
        saveState();
        renderAll(false);
      }

      function resetTaskForm() {
        els.editTaskId.value = '';
        els.taskTitleInput.value = '';
        els.taskNoteInput.value = '';
        els.taskDeadlineInput.value = '';
        els.taskMandatoryInput.checked = false;
        els.cancelEditBtn.style.display = 'none';
        els.submitTaskBtn.textContent = t('addTaskBtn');
      }

      function startEditTask(task) {
        els.editTaskId.value = task.id;
        els.taskTitleInput.value = task.title;
        els.taskNoteInput.value = task.note || '';
        els.taskDeadlineInput.value = task.deadline || '';
        els.taskMandatoryInput.checked = Boolean(task.manualMandatory);
        els.cancelEditBtn.style.display = 'inline-flex';
        els.submitTaskBtn.textContent = t('saveTaskBtn');
        els.taskTitleInput.focus();
      }

      function deleteQueueTask(taskId) {
        state.queue = state.queue.filter(item => item.id !== taskId);
        if (els.editTaskId.value === taskId) {
          resetTaskForm();
        }
        syncFocusSlots();
        renderAll(false);
      }

      function restoreCompletedTask(taskId) {
        const idx = state.completed.findIndex(item => item.id === taskId);
        if (idx === -1) return;

        const [restored] = state.completed.splice(idx, 1);
        const preservedLog = Array.isArray(restored.completionLog) ? restored.completionLog.slice() : [];
        delete restored.completedAt;
        restored.completionLog = preservedLog;

        state.queue.unshift(restored);
        pendingDeleteCompletedId = null;
        syncFocusSlots();
        saveState();
        renderFocusStage(false);
        renderVaultLists();
        showCalmToast(t('restoredToQueueToast'));
      }

      function deleteCompletedTask(taskId) {
        state.completed = state.completed.filter(item => item.id !== taskId);
        expandedHistoryIds.delete(taskId);
        saveState();
        renderVaultLists();
      }

      /* =========================================
         11. EVENT LISTENERS & LAYER ISOLATION
         ========================================= */
      els.softWelcomeOverlay.addEventListener('click', () => {
        dismissSoftWelcomeOverlay();
      });

      els.softWelcomeSkipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dismissSoftWelcomeOverlay();
      });

      els.hamburgerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (hasAnySubModalOpen()) return;
        const isOpen = els.drawerMenu.classList.contains('open');
        if (isOpen) {
          closeDrawerMenu(false);
        } else {
          openDrawerMenu();
        }
      });

      els.drawerBackdrop.addEventListener('click', (e) => {
        e.stopPropagation();
        if (hasAnySubModalOpen()) return;
        if (e.target === els.drawerBackdrop) {
          closeDrawerMenu(false);
        }
      });

      els.drawerMenu.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      els.profileNameInput.addEventListener('input', () => {
        state.profileName = els.profileNameInput.value.slice(0, 32);
        saveState();
        if (!state.profileAvatar) {
          renderProfileSection();
        }
      });

      els.pickAvatarBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setAvatarConfirmState(false, false);
        els.avatarFileInput.click();
      });

      els.avatarFileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (file) {
          openCropModalWithFile(file);
        }
      });

      els.removeAvatarBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!state.profileAvatar) return;
        if (confirmRemoveAvatar) {
          setAvatarConfirmState(false, true);
        } else {
          setAvatarConfirmState(true, false);
        }
      });

      /* Keep drawer menu open when closing crop modal & stop propagation inside crop modal */
      els.cropShell.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      els.cropModalBackdrop.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.target === els.cropModalBackdrop) {
          closeCropModalOnly(false);
        }
      });

      els.resetCropBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetCropperView();
      });

      els.rotateLeftCropBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        rotateCropperBy(-90);
      });

      els.rotateCropBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        rotateCropperBy(90);
      });

      els.saveCropBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cropped = exportCroppedAvatar300();
        if (cropped) {
          state.profileAvatar = cropped;
          confirmRemoveAvatar = false;
          els.removeAvatarBtn.classList.remove('is-confirming');
          els.removeAvatarBtn.blur();
          saveState();
          renderProfileSection();
          closeCropModalOnly(false);
          showCalmToast(t('avatarChangedToast'));
          return;
        }
        closeCropModalOnly(false);
      });

      els.cancelCropBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeCropModalOnly(false);
      });

      window.addEventListener('resize', () => {
        if (els.cropModalBackdrop.classList.contains('open')) {
          if (fallbackCropImage && !cropperInstance) {
            renderOfflineCanvasView(false, 0);
          } else {
            scheduleCircularGuideSync();
          }
        }
      });

      /* Export Backup Modal Events (Keep Drawer Open) */
      els.exportBackupBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openExportBackupModal();
      });

      els.exportModalCard.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      els.saveBackupFileBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const baseName = sanitizeFilenameBase(els.exportFilenameInput.value);
        closeExportBackupModal(false);
        await saveBackupWithSystemPicker(baseName);
      });

      els.closeExportModalBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeExportBackupModal(false);
      });

      els.exportModalBackdrop.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.target === els.exportModalBackdrop) {
          closeExportBackupModal(false);
        }
      });

      /* Import Backup Events (Keep Drawer Open) */
      els.importBackupBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        els.importBackupFileInput.click();
      });

      els.importBackupFileInput.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      els.importBackupFileInput.addEventListener('change', (e) => {
        e.stopPropagation();
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (file) {
          importBackupFromFile(file);
        }
      });

      els.langArBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.lang !== 'ar') {
          state.lang = 'ar';
          saveState();
          renderAll(false);
        }
      });

      els.langEnBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.lang !== 'en') {
          state.lang = 'en';
          saveState();
          renderAll(false);
        }
      });

      els.applyCustomGlitchBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = Math.max(1, parseInt(els.customGlitchValue.value, 10) || 1);
        const unit = els.customGlitchUnit.value === 'minutes' ? 'minutes' : 'seconds';
        state.glitchMode = 'custom';
        state.customGlitchValue = val;
        state.customGlitchUnit = unit;
        state.glitchSeconds = unit === 'minutes' ? val * 60 : val;
        customBoxOpen = true;
        saveState();
        renderDrawerMenu();
        restartGlitchTimer();
      });

      els.shareAppBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        shareCurrentApp();
      });

      els.slotSelector.addEventListener('click', (e) => {
        const btn = e.target.closest('.slot-pill-btn');
        if (!btn) return;
        const count = Number(btn.dataset.slots);
        if ([1, 2, 3].includes(count) && count !== state.slotCount) {
          closeDrawerMenu(false);
          openReorderSlot = null;
          state.slotCount = count;
          saveState();
          renderAll(true);
        }
      });

      document.addEventListener('click', (e) => {
        if (hasAnySubModalOpen()) return;
        if (openReorderSlot !== null && !e.target.closest('.card-reorder-popover')) {
          openReorderSlot = null;
          renderFocusStage(false);
        }
      });

      function activateQueueTabView() {
        confirmClearHistory = false;
        pendingDeleteQueueId = null;
        pendingDeleteCompletedId = null;
        els.tabQueue.classList.add('active');
        els.tabQueue.setAttribute('aria-selected', 'true');
        els.tabCompleted.classList.remove('active');
        els.tabCompleted.setAttribute('aria-selected', 'false');
        els.queueView.style.display = 'block';
        els.completedView.style.display = 'none';
      }

      function openVaultModal() {
        closeDrawerMenu(false);
        openReorderSlot = null;
        activateQueueTabView();
        els.vaultBackdrop.classList.add('open');
        pushLayerHistory('vault');
        renderVaultLists();
      }

      function closeVaultModal(fromPopstate = false) {
        destroyQueueSortable();
        els.vaultBackdrop.classList.remove('open');
        resetTaskForm();
        confirmClearHistory = false;
        pendingDeleteQueueId = null;
        pendingDeleteCompletedId = null;
        if (!fromPopstate) {
          popLayerHistorySilent('vault');
        }
      }

      els.openVaultBtn.addEventListener('click', openVaultModal);
      els.closeVaultBtn.addEventListener('click', () => closeVaultModal(false));
      els.vaultBackdrop.addEventListener('click', (e) => {
        if (e.target === els.vaultBackdrop) closeVaultModal(false);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (els.softWelcomeOverlay.classList.contains('open')) {
            dismissSoftWelcomeOverlay();
            return;
          }
          if (els.cropModalBackdrop.classList.contains('open')) {
            e.stopPropagation();
            closeCropModalOnly(false);
            return;
          }
          if (els.exportModalBackdrop.classList.contains('open')) {
            e.stopPropagation();
            closeExportBackupModal(false);
            return;
          }
          if (els.vaultBackdrop.classList.contains('open')) {
            closeVaultModal(false);
            return;
          }
          closeDrawerMenu(false);
          if (openReorderSlot !== null) {
            openReorderSlot = null;
            renderFocusStage(false);
          }
        }
      });

      els.tabQueue.addEventListener('click', () => {
        activateQueueTabView();
        renderVaultLists();
      });

      els.tabCompleted.addEventListener('click', () => {
        destroyQueueSortable();
        pendingDeleteQueueId = null;
        els.tabCompleted.classList.add('active');
        els.tabCompleted.setAttribute('aria-selected', 'true');
        els.tabQueue.classList.remove('active');
        els.tabQueue.setAttribute('aria-selected', 'false');
        els.completedView.style.display = 'block';
        els.queueView.style.display = 'none';
        renderVaultLists();
      });

      els.cancelEditBtn.addEventListener('click', resetTaskForm);

      els.taskForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = els.taskTitleInput.value.trim();
        if (!title) return;

        const note = els.taskNoteInput.value.trim();
        const deadline = els.taskDeadlineInput.value || '';
        const manualMandatory = els.taskMandatoryInput.checked;
        const editingId = els.editTaskId.value;

        if (editingId) {
          const existing = state.queue.find(item => item.id === editingId);
          if (existing) {
            existing.title = title;
            existing.note = note;
            existing.deadline = deadline;
            existing.manualMandatory = manualMandatory;
          }
          resetTaskForm();
          syncFocusSlots();
          renderAll(false);
        } else {
          state.queue.push({
            id: generateId(),
            title,
            note,
            deadline,
            manualMandatory,
            completionLog: [],
            createdAt: new Date().toISOString()
          });
          resetTaskForm();
          syncFocusSlots();
          const hasAnyAssignedSlot = state.slots.some(Boolean);
          if (!hasAnyAssignedSlot && state.queue.length > 0) {
            state.slots[0] = state.queue[0].id;
            saveState();
          }
          renderAll(false);
          showCalmToast(t('taskAddedToast'));
        }
      });

      /* =========================================
         12. INITIALIZATION
         ========================================= */
      function renderAll(animateEntrance = false) {
        applyThemeAndLang();
        renderFocusStage(animateEntrance);
        renderVaultLists();
      }

      syncFocusSlots();
      const allSlotsEmptyOnBoot = !state.slots.some(Boolean);
      if (allSlotsEmptyOnBoot && state.queue.length > 0) {
        state.slots[0] = state.queue[0].id;
        saveState();
      }
      renderAll(true);
      restartGlitchTimer();
      if (state.theme === 'soft') {
        triggerSoftWelcomeOverlay();
      }

      window.addEventListener('load', () => {
        if (els.vaultBackdrop.classList.contains('open') && els.queueView.style.display !== 'none') {
          initQueueSortable();
        }
      });
    })();
  </script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
