<!-- V2.2.11 -->
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="navy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1320">
  <link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/jpeg" href="./icon.jpg">
<link rel="apple-touch-icon" href="./icon.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>نقطة تركيز | Nuqtat Tarkiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    /* =========================================
       1. CSS VARIABLES & 4 BUILT-IN THEMES
       ========================================= */
    :root,
    [data-theme="navy"] {
      --bg-primary: #0b1320;
      --bg-card: #131e30;
      --bg-elevated: #19273e;
      --bg-input: #0e1828;
      --border-color: #1f304a;
      --border-focus: #38bdf8;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-text: #082f49;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --badge-soft-bg: rgba(56, 189, 248, 0.14);
      --badge-soft-border: rgba(56, 189, 248, 0.32);
      --badge-soft-text: #7dd3fc;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.14);
      --danger: #e07a7a;
      --danger-bg: rgba(224, 122, 122, 0.12);
      --danger-border-soft: rgba(224, 122, 122, 0.42);
      --warning: #d99b26;
      --warning-bg: rgba(217, 155, 38, 0.13);
      --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.45);
      --shadow-dropdown: 0 14px 34px -6px rgba(0, 0, 0, 0.65);
      --overlay-bg: rgba(5, 9, 17, 0.78);
      --crop-shell-bg: #0b1320;
      --crop-stage-bg: #0e1828;
      --crop-dim-mask: rgba(11, 19, 32, 0.56);
      --theme-icon-bg: #162238;
      --theme-icon-border: #263a5c;
      --dev-emoji-halo: drop-shadow(0 0 5px rgba(241, 245, 249, 0.34));
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-card: #121212;
      --bg-elevated: #1c1c1c;
      --bg-input: #0a0a0a;
      --border-color: #262626;
      --border-focus: #60a5fa;
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --text-muted: #737373;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --accent-text: #0a0a0a;
      --accent-glow: rgba(96, 165, 250, 0.35);
      --badge-soft-bg: rgba(96, 165, 250, 0.14);
      --badge-soft-border: rgba(96, 165, 250, 0.32);
      --badge-soft-text: #93c5fd;
      --success: #4ade80;
      --success-bg: rgba(74, 222, 128, 0.14);
      --danger: #e07a7a;
      --danger-bg: rgba(224, 122, 122, 0.12);
      --danger-border-soft: rgba(224, 122, 122, 0.42);
      --warning: #d99b26;
      --warning-bg: rgba(217, 155, 38, 0.13);
      --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.85);
      --shadow-dropdown: 0 14px 34px -6px rgba(0, 0, 0, 0.9);
      --overlay-bg: rgba(0, 0, 0, 0.85);
      --crop-shell-bg: #000000;
      --crop-stage-bg: #121212;
      --crop-dim-mask: rgba(0, 0, 0, 0.62);
      --theme-icon-bg: #262930;
      --theme-icon-border: #3a3f4a;
      --dev-emoji-halo: drop-shadow(0 0 5px rgba(255, 255, 255, 0.36));
    }

    [data-theme="light"] {
      --bg-primary: #e8eef5;
      --bg-card: #ffffff;
      --bg-elevated: #f1f5f9;
      --bg-input: #f8fafc;
      --border-color: #cbd5e1;
      --border-focus: #0284c7;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-text: #ffffff;
      --accent-glow: rgba(2, 132, 199, 0.28);
      --badge-soft-bg: rgba(2, 132, 199, 0.11);
      --badge-soft-border: rgba(2, 132, 199, 0.28);
      --badge-soft-text: #0369a1;
      --success: #16a34a;
      --success-bg: rgba(22, 163, 74, 0.12);
      --danger: #c25959;
      --danger-bg: rgba(194, 89, 89, 0.1);
      --danger-border-soft: rgba(194, 89, 89, 0.38);
      --warning: #b4690e;
      --warning-bg: rgba(180, 105, 14, 0.11);
      --shadow-card: 0 10px 28px -6px rgba(15, 23, 42, 0.08);
      --shadow-dropdown: 0 14px 34px -6px rgba(15, 23, 42, 0.14);
      --overlay-bg: rgba(15, 23, 42, 0.55);
      --crop-shell-bg: #e8eef5;
      --crop-stage-bg: #f1f5f9;
      --crop-dim-mask: rgba(15, 23, 42, 0.45);
      --theme-icon-bg: #e0f2fe;
      --theme-icon-border: #bae6fd;
      --dev-emoji-halo: drop-shadow(0 2px 5px rgba(15, 23, 42, 0.18));
    }

    [data-theme="soft"] {
      --bg-primary: #f6eef2;
      --bg-card: #ffffff;
      --bg-elevated: #ffffff;
      --bg-input: #ffffff;
      --border-color: #eed8e3;
      --border-focus: #c85a82;
      --text-primary: #2d2329;
      --text-secondary: #685560;
      --text-muted: #8b7582;
      --accent: #c85a82;
      --accent-hover: #b2486f;
      --accent-text: #ffffff;
      --accent-glow: rgba(200, 90, 130, 0.24);
      --badge-soft-bg: #fceef4;
      --badge-soft-border: #eed8e3;
      --badge-soft-text: #9d3b60;
      --success: #9d3b60;
      --success-bg: #fceef4;
      --danger: #c25959;
      --danger-bg: rgba(194, 89, 89, 0.1);
      --danger-border-soft: rgba(194, 89, 89, 0.36);
      --warning: #b4690e;
      --warning-bg: rgba(180, 105, 14, 0.1);
      --shadow-card: 0 10px 26px -8px rgba(157, 59, 96, 0.11);
      --shadow-dropdown: 0 14px 32px -6px rgba(157, 59, 96, 0.15);
      --overlay-bg: rgba(45, 35, 41, 0.46);
      --crop-shell-bg: #f6eef2;
      --crop-stage-bg: #ffffff;
      --crop-dim-mask: rgba(45, 35, 41, 0.44);
      --theme-icon-bg: #fceef4;
      --theme-icon-border: #eed8e3;
      --dev-emoji-halo: drop-shadow(0 2px 5px rgba(157, 59, 96, 0.22));
    }

    /* =========================================
       2. RESET & BASE STYLES (UNIFIED 0.18s THEME TRANSITION)
       ========================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Arabic", sans-serif;
      line-height: 1.5;
      transition: background-color 0.18s cubic-bezier(0.4, 0, 0.2, 1), color 0.18s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    body.menu-scroll-locked {
      overflow: hidden !important;
      touch-action: none;
    }

    body.menu-scroll-locked .focus-stage {
      overflow: hidden !important;
      touch-action: none;
      pointer-events: none;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
      transition: background-color 0.18s cubic-bezier(0.4, 0, 0.2, 1), color 0.18s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.18s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s ease, box-shadow 0.2s ease;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      border-radius: 12px;
      font-weight: 600;
    }

    button:active {
      transform: scale(0.97);
    }

    svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Soft Theme Welcome Overlay (Stays Open Until Tapped / Escape) */
    .soft-welcome-overlay {
      position: fixed;
      inset: 0;
      z-index: 220;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(155deg, #f6eef2 0%, #fceef4 58%, #f6eef2 100%);
      opacity: 0;
      transition: opacity 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .soft-welcome-overlay.open {
      display: flex;
      opacity: 1;
    }

    .soft-welcome-card {
      background-color: #ffffff;
      border: 1.5px solid #eed8e3;
      border-radius: 26px;
      padding: 2.1rem 1.85rem 1.75rem;
      max-width: 390px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 36px -12px rgba(157, 59, 96, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }

    .soft-welcome-ribbon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background-color: #fceef4;
      border: 1px solid #eed8e3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      line-height: 1;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .soft-welcome-text {
      font-size: 1.22rem;
      font-weight: 800;
      color: #2d2329;
      line-height: 1.5;
      unicode-bidi: plaintext;
    }

    .soft-welcome-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: #9d3b60;
      background-color: #fceef4;
      border: 1px solid #eed8e3;
      padding: 0.24rem 0.75rem;
      border-radius: 999px;
    }

    .soft-welcome-skip-btn {
      margin-top: 0.35rem;
      min-height: 40px;
      padding: 0.45rem 1.15rem;
      border-radius: 999px;
      background-color: #fceef4;
      border: 1px solid #eed8e3;
      color: #9d3b60;
      font-size: 0.84rem;
      font-weight: 700;
    }

    @media (hover: hover) {
      .soft-welcome-skip-btn:hover {
        background-color: #c85a82;
        border-color: #c85a82;
        color: #ffffff;
      }
    }

    /* =========================================
       3. SINGLE-ROW TOP BAR, BACKDROP & COMPACT MENU (☰)
       ========================================= */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 55;
    }

    .drawer-backdrop.open {
      display: block;
      animation: fadeIn 0.16s ease;
    }

    .top-bar {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0.65rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      position: relative;
      z-index: 60;
    }

    .top-end-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
      position: relative;
      z-index: 40;
    }

    .menu-trigger-wrap {
      position: relative;
      flex-shrink: 0;
      z-index: 65;
    }

    .hamburger-btn {
      width: 44px;
      height: 44px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 1.2rem;
      position: relative;
      z-index: 66;
      outline: none;
    }

    .hamburger-btn:focus,
    .hamburger-btn:focus-visible {
      outline: none;
    }

    @media (hover: hover) {
      .hamburger-btn:hover {
        border-color: var(--accent);
        background-color: var(--bg-elevated);
      }
    }

    .hamburger-btn.is-open,
    .hamburger-btn[aria-expanded="true"] {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .status-dot {
      position: absolute;
      top: 7px;
      inset-inline-end: 7px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--accent);
      box-shadow: 0 0 0 2px var(--bg-card);
      display: none;
    }

    .hamburger-btn.has-alert .status-dot {
      display: block;
    }

    .one-tap-slots {
      display: inline-flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3px;
      height: 44px;
      flex-shrink: 0;
      transition: background-color 0.18s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slot-pill-btn {
      min-width: 34px;
      min-height: 36px;
      padding: 0 0.5rem;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    @media (hover: hover) {
      .slot-pill-btn:hover {
        color: var(--text-primary);
      }
    }

    .slot-pill-btn.active {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .vault-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0 0.9rem;
      font-size: 0.88rem;
      height: 44px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (hover: hover) {
      .vault-btn:hover {
        border-color: var(--accent);
        background-color: var(--bg-elevated);
      }
    }

    /* Compact Single-Screen Drawer Menu */
    .drawer-menu {
      position: absolute;
      top: calc(100% + 8px);
      inset-inline-start: 0;
      width: min(344px, calc(100vw - 1.25rem));
      max-height: calc(100dvh - 72px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 0.55rem 0.65rem;
      box-shadow: var(--shadow-dropdown);
      display: none;
      flex-direction: column;
      gap: 0.42rem;
      z-index: 70;
    }

    .drawer-menu.open {
      display: flex;
      animation: dropReveal 0.16s ease;
    }

    @keyframes dropReveal {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .drawer-brand {
      padding: 0 0.25rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.4rem;
    }

    .drawer-brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .drawer-brand-subtitle {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .profile-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .profile-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.55rem;
      padding: 0.38rem 0.5rem;
      border-radius: 13px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      flex: 1;
    }

    .avatar-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--accent);
      color: var(--accent-text);
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--border-color);
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-name-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .profile-name-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.15rem 0.3rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-primary);
      outline: none;
      min-height: 36px;
      unicode-bidi: plaintext;
    }

    .profile-name-input:focus {
      background-color: var(--bg-input);
      border-color: var(--border-focus);
    }

    .profile-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .profile-mini-btn {
      min-width: 38px;
      min-height: 38px;
      padding: 0 0.45rem;
      border-radius: 10px;
      font-size: 0.76rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      outline: none;
    }

    .profile-mini-btn:focus,
    .profile-mini-btn:focus-visible {
      outline: none;
    }

    @media (hover: hover) {
      .profile-mini-btn:hover {
        color: var(--text-primary);
        border-color: var(--accent);
      }
    }

    .profile-mini-btn.remove-avatar.is-confirming {
      color: var(--danger);
      border-color: var(--danger);
      background-color: var(--danger-bg);
    }

    @media (hover: hover) {
      .profile-mini-btn.remove-avatar:hover {
        color: var(--danger);
        border-color: var(--danger);
        background-color: var(--danger-bg);
      }
    }

    .drawer-section {
      display: flex;
      flex-direction: column;
      gap: 0.26rem;
    }

    .drawer-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 0.25rem;
    }

    .drawer-divider {
      height: 1px;
      background-color: var(--border-color);
      margin: 0.02rem 0;
    }

    /* 2x2 Grid for the 4 Themes + Floating Icon Badge */
    .themes-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.35rem;
    }

    .theme-grid-btn {
      min-height: 40px;
      min-width: 0;
      padding: 0.28rem 0.45rem;
      border-radius: 11px;
      font-size: 0.78rem;
      font-weight: 700;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      justify-content: flex-start;
      gap: 0.42rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (hover: hover) {
      .theme-grid-btn:hover {
        border-color: var(--accent);
      }
    }

    .theme-grid-btn.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .theme-floating-icon {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      line-height: 1;
      flex-shrink: 0;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .theme-floating-icon.icon-soft {
      background-color: #fceef4;
      border-color: #eed8e3;
    }

    .theme-floating-icon.icon-navy {
      background-color: #162238;
      border-color: #263a5c;
    }

    .theme-floating-icon.icon-light {
      background-color: #e0f2fe;
      border-color: #bae6fd;
    }

    .theme-floating-icon.icon-dark {
      background-color: #262930;
      border-color: #3a3f4a;
    }

    .theme-grid-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pills-row-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.25rem;
    }

    .pill-choice-btn {
      min-height: 38px;
      min-width: 0;
      padding: 0.25rem 0.25rem;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 600;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (hover: hover) {
      .pill-choice-btn:hover {
        color: var(--text-primary);
        border-color: var(--accent);
      }
    }

    .pill-choice-btn.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
    }

    .lang-pair-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
    }

    .lang-choice-btn {
      min-height: 38px;
      border-radius: 10px;
      font-size: 0.82rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .lang-choice-btn.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .custom-glitch-box {
      margin-top: 0.15rem;
      padding: 0.45rem;
      border-radius: 11px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      gap: 0.35rem;
    }

    .custom-glitch-box.open {
      display: flex;
    }

    .custom-glitch-controls {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }

    .glitch-num-input {
      width: 74px;
      min-height: 40px;
      padding: 0.25rem 0.45rem;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .glitch-num-input:focus {
      border-color: var(--border-focus);
    }

    .glitch-unit-select {
      flex: 1;
      min-height: 40px;
      padding: 0.25rem 0.45rem;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
    }

    .glitch-apply-btn {
      min-height: 40px;
      padding: 0 0.65rem;
      border-radius: 9px;
      font-size: 0.8rem;
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .drawer-action-btn {
      width: 100%;
      min-height: 38px;
      padding: 0.35rem 0.55rem;
      border-radius: 10px;
      justify-content: flex-start;
      font-size: 0.8rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    @media (hover: hover) {
      .drawer-action-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
    }

    .backup-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
    }

    .backup-status-msg {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.5rem;
      border-radius: 8px;
      background-color: var(--success-bg);
      color: var(--success);
      display: none;
      line-height: 1.35;
    }

    .backup-status-msg.error {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .backup-status-msg.visible {
      display: block;
    }

    /* Sidebar Footer (Developer Identity & Version Badge) */
    .drawer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem;
      padding: 0.32rem 0.48rem;
      border-radius: 11px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      min-height: 36px;
    }

    .drawer-dev-label {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.3;
      unicode-bidi: plaintext;
      min-width: 0;
    }

    .drawer-emoji-iso {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
      filter: var(--dev-emoji-halo);
      transition: filter 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .drawer-version-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.14rem 0.5rem;
      border-radius: 999px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1.2;
      direction: ltr;
      unicode-bidi: isolate;
      flex-shrink: 0;
    }

    @media (max-width: 420px) {
      .top-bar {
        padding: 0.65rem 0.65rem;
        gap: 0.35rem;
      }
      .top-end-group {
        gap: 0.35rem;
      }
      .slot-pill-btn {
        min-width: 30px;
        padding: 0 0.4rem;
        font-size: 0.84rem;
      }
      .vault-btn {
        padding: 0 0.72rem;
        font-size: 0.83rem;
      }
    }

    /* =========================================
       4. MAIN FOCUS STAGE & DOUBLE-BLINK GLITCH
       ========================================= */
    .focus-stage {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.15rem;
    }

    .focus-card {
      position: relative;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 1.85rem 1.65rem;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      transition: border-color 0.18s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.18s cubic-bezier(0.4, 0, 0.2, 1), color 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .focus-card.animate-enter {
      animation: fadeSlideIn 0.24s ease;
    }

    .focus-card.is-mandatory {
      border-color: var(--border-color);
    }

    .focus-card.is-overdue {
      border-color: var(--danger-border-soft);
    }

    .focus-card.glitch-blink-sequence {
      animation: doubleBlinkGlitch 2.8s linear 1;
    }

    @keyframes doubleBlinkGlitch {
      0% { opacity: 1; }
      4% { opacity: 0; }
      29% { opacity: 0; }
      33% { opacity: 1; }
      51% { opacity: 1; }
      55% { opacity: 0; }
      80% { opacity: 0; }
      84% { opacity: 1; }
      100% { opacity: 1; }
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-reorder-popover {
      position: absolute;
      top: -18px;
      inset-inline-end: 1.25rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 0.3rem 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: var(--shadow-dropdown);
      z-index: 25;
      animation: dropReveal 0.16s ease;
    }

    .popover-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      padding-inline: 0.25rem;
    }

    .pos-choice-btn {
      min-width: 38px;
      min-height: 38px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    @media (hover: hover) {
      .pos-choice-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
    }

    .pos-choice-btn.current-pos {
      background-color: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.72rem;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .badge-mandatory {
      background-color: var(--warning-bg);
      color: var(--warning);
    }

    .badge-deadline {
      background-color: var(--badge-soft-bg);
      border: 1px solid var(--badge-soft-border);
      color: var(--badge-soft-text);
    }

    .badge-deadline.urgent {
      background-color: var(--warning-bg);
      border-color: transparent;
      color: var(--warning);
    }

    .badge-deadline.overdue {
      background-color: var(--danger-bg);
      border-color: transparent;
      color: var(--danger);
    }

    .task-title {
      font-size: clamp(1.3rem, 3.4vw, 1.8rem);
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-primary);
      word-break: break-word;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
    }

    .task-note {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.65;
      white-space: pre-line;
      word-break: break-word;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.35rem;
      flex-wrap: wrap;
    }

    .btn-done {
      flex: 1;
      min-width: 140px;
      background-color: var(--accent);
      color: var(--accent-text);
      font-size: 0.98rem;
      padding: 0.75rem 1.25rem;
      border-radius: 14px;
    }

    @media (hover: hover) {
      .btn-done:hover {
        background-color: var(--accent-hover);
      }
    }

    .btn-defer {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.94rem;
      padding: 0.75rem 1.15rem;
      border-radius: 14px;
    }

    @media (hover: hover) {
      .btn-defer:hover {
        color: var(--text-primary);
        border-color: var(--text-muted);
      }
    }

    .rest-card {
      background-color: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 22px;
      padding: 2rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      transition: background-color 0.18s cubic-bezier(0.4, 0, 0.2, 1), color 0.18s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .rest-card.animate-enter {
      animation: fadeSlideIn 0.24s ease;
    }

    .rest-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: var(--badge-soft-bg);
      border: 1px solid var(--badge-soft-border);
      color: var(--badge-soft-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rest-icon.empty-vault-icon {
      background-color: var(--badge-soft-bg);
      border: 1px solid var(--badge-soft-border);
      color: var(--badge-soft-text);
    }

    .rest-message {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-primary);
      unicode-bidi: plaintext;
    }

    .rest-sub {
      font-size: 0.92rem;
      color: var(--text-secondary);
      max-width: 410px;
      line-height: 1.6;
      unicode-bidi: plaintext;
    }

    .btn-pull {
      background-color: var(--bg-elevated);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.7rem 1.45rem;
      font-size: 0.95rem;
      border-radius: 14px;
      margin-top: 0.2rem;
    }

    @media (hover: hover) {
      .btn-pull:hover {
        background-color: var(--accent);
        color: var(--accent-text);
      }
    }

    /* =========================================
       5. TOP CALM TOAST BANNER + UNDO BUTTON
       ========================================= */
    .calm-toast {
      position: fixed;
      top: calc(0.85rem + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-18px);
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1.5px solid var(--accent);
      border-radius: 16px;
      padding: 0.55rem 0.85rem;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: var(--shadow-dropdown);
      z-index: 180;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: calc(100vw - 1.5rem);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      text-align: center;
    }

    .calm-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .calm-toast-msg {
      unicode-bidi: plaintext;
      line-height: 1.4;
    }

    .toast-undo-btn {
      min-height: 34px;
      min-width: auto;
      padding: 0.25rem 0.68rem;
      border-radius: 10px;
      background-color: var(--accent);
      color: var(--accent-text);
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      display: none;
    }

    .toast-undo-btn.visible {
      display: inline-flex;
    }

    @media (hover: hover) {
      .toast-undo-btn:hover {
        background-color: var(--accent-hover);
      }
    }

    /* =========================================
       6. MODALS, THEME-ADAPTIVE CROPPER & EXPORT
       ========================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--overlay-bg);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0.85rem;
      padding-top: max(0.85rem, env(safe-area-inset-top));
      padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
      z-index: 100;
    }

    .modal-backdrop.sub-modal-backdrop {
      z-index: 120;
    }

    .modal-backdrop.crop-backdrop {
      background-color: var(--crop-shell-bg);
      padding: 0;
      z-index: 130;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .vault-modal {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 680px;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overflow-x: hidden;
      box-shadow: var(--shadow-card);
    }

    .compact-modal {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 410px;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .vault-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .vault-title {
      font-size: 1.12rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-close {
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }

    @media (hover: hover) {
      .btn-close:hover {
        color: var(--text-primary);
      }
    }

    /* Theme-Adaptive Cropper Shell (Matches Both Cropper.js & Offline Canvas Fallback) */
    .wa-crop-shell {
      width: 100vw;
      height: 100dvh;
      background-color: var(--crop-shell-bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(0.55rem, env(safe-area-inset-top));
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      padding-left: max(0.75rem, env(safe-area-inset-left));
      padding-right: max(0.75rem, env(safe-area-inset-right));
      user-select: none;
      overflow: hidden;
      gap: 0.6rem;
    }

    .crop-top-bar {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0.5rem 0.85rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .crop-top-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .wa-crop-stage {
      flex: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: var(--crop-stage-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      min-height: 0;
      touch-action: none;
    }

    .wa-crop-stage img#cropSourceImg {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .wa-crop-stage canvas#cropFallbackCanvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      display: none;
      touch-action: none;
    }

    /* Circular preview ring & soft mask inside the 1:1 crop box */
    .crop-circle-guide {
      position: absolute;
      width: var(--crop-ring-size, 240px);
      height: var(--crop-ring-size, 240px);
      left: var(--crop-ring-left, 50%);
      top: var(--crop-ring-top, 50%);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 9999px var(--crop-dim-mask), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 6;
      display: none;
    }

    .crop-circle-guide.active {
      display: block;
    }

    .wa-crop-stage .cropper-bg {
      background: var(--crop-stage-bg) !important;
    }

    .wa-crop-stage .cropper-modal {
      background-color: transparent !important;
    }

    .wa-crop-stage .cropper-view-box {
      outline: 1.5px solid var(--accent);
      outline-offset: 0;
    }

    .wa-crop-stage .cropper-dashed {
      border-color: rgba(255, 255, 255, 0.55);
    }

    .wa-crop-stage .cropper-line {
      background-color: rgba(255, 255, 255, 0.38);
    }

    .wa-crop-stage .cropper-point {
      width: 14px !important;
      height: 14px !important;
      background-color: var(--accent) !important;
      border: 2px solid var(--bg-card) !important;
      border-radius: 3px !important;
      opacity: 1 !important;
    }

    .wa-crop-stage .cropper-point.point-n,
    .wa-crop-stage .cropper-point.point-s {
      width: 20px !important;
      height: 5px !important;
      opacity: 0.85 !important;
    }

    .wa-crop-stage .cropper-point.point-e,
    .wa-crop-stage .cropper-point.point-w {
      width: 5px !important;
      height: 20px !important;
      opacity: 0.85 !important;
    }

    .crop-bottom-panel {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0.65rem 0.75rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      flex-shrink: 0;
    }

    /* Single-row capsule controls: Rotate Right | Reset | Rotate Left in LTR order */
    .crop-capsules-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .crop-capsule-btn {
      min-height: 44px;
      min-width: 0;
      padding: 0 0.65rem;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-weight: 700;
      gap: 0.32rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (hover: hover) {
      .crop-capsule-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
    }

    .crop-capsule-btn.reset-pill-btn {
      color: var(--text-secondary);
    }

    @media (hover: hover) {
      .crop-capsule-btn.reset-pill-btn:hover {
        color: var(--text-primary);
        border-color: var(--accent);
      }
    }

    .crop-confirm-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .crop-confirm-btn {
      flex: 1;
      min-height: 46px;
      padding: 0 1.2rem;
      border-radius: 14px;
      background-color: var(--accent);
      border: 1px solid var(--accent);
      color: var(--accent-text);
      font-size: 0.98rem;
      font-weight: 700;
      box-shadow: 0 6px 18px -4px var(--accent-glow);
    }

    @media (hover: hover) {
      .crop-confirm-btn:hover {
        background-color: var(--accent-hover);
        border-color: var(--accent-hover);
      }
    }

    .crop-cancel-btn {
      min-height: 46px;
      padding: 0 1.15rem;
      border-radius: 14px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 700;
    }

    @media (hover: hover) {
      .crop-cancel-btn:hover {
        color: var(--text-primary);
        border-color: var(--text-muted);
      }
    }

    /* Export Backup Modal Body */
    .export-body {
      padding: 1.15rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }

    .filename-input-group {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--bg-input);
      overflow: hidden;
    }

    .filename-input-group:focus-within {
      border-color: var(--border-focus);
    }

    .filename-field {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0.55rem 0.8rem;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      unicode-bidi: plaintext;
    }

    .filename-ext {
      display: inline-flex;
      align-items: center;
      padding: 0 0.75rem;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-muted);
      background-color: var(--bg-elevated);
      border-inline-start: 1px solid var(--border-color);
      user-select: none;
      direction: ltr;
      unicode-bidi: isolate;
    }

    /* Vault Tabs */
    .vault-tabs {
      display: flex;
      padding: 0.6rem 1.25rem 0;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-primary);
    }

    .tab-btn {
      flex: 1;
      border-radius: 12px 12px 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      color: var(--text-secondary);
      font-size: 0.92rem;
      padding: 0.6rem 0.9rem;
      position: relative;
      bottom: -1px;
    }

    .tab-btn.active {
      background-color: var(--bg-card);
      border-color: var(--border-color);
      color: var(--accent);
    }

    .tab-count {
      font-size: 0.76rem;
      padding: 0.1rem 0.48rem;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .tab-btn.active .tab-count {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .vault-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      max-width: 100%;
      padding: 1.15rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      overscroll-behavior: contain;
    }

    .task-form {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-width: 100%;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
      min-width: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      align-items: end;
    }

    .form-label {
      font-size: 0.81rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-input {
      width: 100%;
      min-height: 44px;
      padding: 0.58rem 0.8rem;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      unicode-bidi: plaintext;
    }

    .form-input:focus {
      border-color: var(--border-focus);
    }

    .toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 0.5rem 0.8rem;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      cursor: pointer;
      user-select: none;
    }

    .toggle-label-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .switch-track {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background-color: var(--border-color);
      position: relative;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .switch-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #ffffff;
      position: absolute;
      top: 3px;
      inset-inline-start: 3px;
      transition: transform 0.2s ease;
    }

    input[type="checkbox"]:checked + .switch-track {
      background-color: var(--accent);
    }

    [dir="rtl"] input[type="checkbox"]:checked + .switch-track .switch-thumb {
      transform: translateX(-20px);
    }

    [dir="ltr"] input[type="checkbox"]:checked + .switch-track .switch-thumb {
      transform: translateX(20px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .form-actions {
      display: flex;
      gap: 0.55rem;
      justify-content: flex-end;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
      padding: 0 1.2rem;
      font-size: 0.92rem;
    }

    @media (hover: hover) {
      .btn-primary:hover {
        background-color: var(--accent-hover);
      }
    }

    .btn-secondary {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0 0.95rem;
      font-size: 0.88rem;
    }

    @media (hover: hover) {
      .btn-secondary:hover {
        color: var(--text-primary);
        border-color: var(--text-muted);
      }
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: relative;
      border-radius: 14px;
      max-width: 100%;
      overflow-x: hidden;
    }

    .list-item {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 0.72rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      user-select: none;
      position: relative;
      max-width: 100%;
      overflow-x: hidden;
    }

    .list-item.is-active-slot {
      border-inline-start: 3px solid var(--accent);
    }

    .sortable-ghost-calm {
      opacity: 0.45;
      background-color: var(--bg-elevated) !important;
      border: 1px dashed var(--accent) !important;
    }

    .sortable-chosen-calm {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.4);
    }

    .drag-handle {
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: grab;
      touch-action: none;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .drag-handle:active {
      cursor: grabbing;
      color: var(--accent);
      background-color: var(--bg-elevated);
    }

    .item-content {
      flex: 1;
      min-width: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .item-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
    }

    .item-note {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.55;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.38rem;
      margin-top: 0.12rem;
    }

    .mini-tag {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.16rem 0.52rem;
      border-radius: 6px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .mini-tag.active-tag {
      background-color: var(--badge-soft-bg);
      border: 1px solid var(--badge-soft-border);
      color: var(--badge-soft-text);
    }

    .mini-tag.mandatory-tag {
      background-color: var(--warning-bg);
      color: var(--warning);
    }

    .mini-tag.overdue-tag {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .repeat-badge-btn {
      min-height: 28px;
      min-width: auto;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      background-color: var(--badge-soft-bg);
      border: 1px solid var(--badge-soft-border);
      color: var(--badge-soft-text);
    }

    @media (hover: hover) {
      .repeat-badge-btn:hover {
        border-color: var(--accent);
      }
    }

    .history-drawer {
      margin-top: 0.45rem;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .history-drawer-title {
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.1rem;
    }

    .history-entry {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      flex-shrink: 0;
    }

    .ctrl-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 10px;
      color: var(--text-secondary);
      background-color: transparent;
    }

    @media (hover: hover) {
      .ctrl-btn:hover:not(:disabled) {
        background-color: var(--bg-elevated);
        color: var(--text-primary);
      }
    }

    .ctrl-btn:disabled {
      opacity: 0.26;
      cursor: not-allowed;
    }

    @media (hover: hover) {
      .ctrl-btn.danger:hover {
        background-color: var(--danger-bg);
        color: var(--danger);
      }
    }

    .completed-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .btn-clear-history {
      background-color: var(--danger-bg);
      color: var(--danger);
      padding: 0 0.9rem;
      font-size: 0.84rem;
      margin-inline-start: auto;
    }

    .confirm-bar {
      width: 100%;
      background-color: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: 12px;
      padding: 0.65rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      flex-wrap: wrap;
      font-size: 0.86rem;
    }

    .empty-list-msg {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    @media (max-width: 600px) {
      .focus-stage {
        padding: 1rem 0.85rem 2rem;
      }

      .focus-card {
        padding: 1.45rem 1.2rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .list-item {
        flex-wrap: wrap;
      }

      .item-controls {
        width: 100%;
        justify-content: flex-end;
        border-top: 1px solid var(--border-color);
        padding-top: 0.35rem;
        margin-top: 0.15rem;
      }

      .crop-capsule-btn {
        padding: 0 0.45rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- SOFT THEME WELCOME OVERLAY (Stays Open Until Tapped / Escape) -->
  <div class="soft-welcome-overlay" id="softWelcomeOverlay" role="dialog" aria-modal="true" aria-live="polite">
    <div class="soft-welcome-card" id="softWelcomeCard">
      <div class="soft-welcome-ribbon" aria-hidden="true">🎀</div>
      <div class="soft-welcome-text" id="softWelcomeText">أهلاً بيكي في عالمك الخاص 🎀</div>
      <div class="soft-welcome-tag" id="softWelcomeTag">ناعم • Soft</div>
      <button type="button" class="soft-welcome-skip-btn" id="softWelcomeSkipBtn">انقر للتخطي</button>
    </div>
  </div>

  <!-- BACKDROP LAYER FOR DRAWER ISOLATION -->
  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

  <!-- SINGLE-ROW TOP BAR -->
  <header class="top-bar">
    <!-- Start Element: Hamburger Menu Button (☰) with Status Dot -->
    <div class="menu-trigger-wrap" id="menuWrap">
      <button type="button" id="hamburgerBtn" class="hamburger-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
        <span>☰</span>
        <span class="status-dot" aria-hidden="true"></span>
      </button>

      <div class="drawer-menu" id="drawerMenu" role="menu">
        <!-- 1. Brand & Profile Identity Card -->
        <div class="drawer-brand">
          <div class="drawer-brand-title" id="drawerBrandTitle">نقطة تركيز</div>
          <div class="drawer-brand-subtitle">Anti-Overwhelm Focus</div>
        </div>

        <div class="profile-wrap" id="profileWrap">
          <div class="profile-box" id="profileBox">
            <div class="profile-left">
              <div class="avatar-circle" id="avatarCircle" aria-hidden="true">ن</div>
              <div class="profile-name-wrap">
                <input type="text" id="profileNameInput" class="profile-name-input" dir="auto" maxlength="32" autocomplete="off">
              </div>
            </div>
            <div class="profile-actions">
              <button type="button" class="profile-mini-btn" id="pickAvatarBtn">صورة</button>
              <button type="button" class="profile-mini-btn remove-avatar" id="removeAvatarBtn" style="display: none;" aria-label="Remove avatar">✕</button>
            </div>
            <input type="file" id="avatarFileInput" accept="image/*" class="sr-only">
          </div>
          <div id="avatarConfirmSlot"></div>
        </div>

        <div class="drawer-divider"></div>

        <!-- 2. Themes (2x2 Grid: Soft | Calm Night / Frost | Dark Mode) -->
        <div class="drawer-section">
          <div class="drawer-section-title" id="menuThemesTitle">الثيمات</div>
          <div class="themes-grid-2x2" id="themeOptionsGrid"></div>
        </div>

        <div class="drawer-divider"></div>

        <!-- 3. Visual Glitch Alert (Horizontal Pill Row) -->
        <div class="drawer-section">
          <div class="drawer-section-title" id="menuGlitchTitle">منبه الرعشة البصري</div>
          <div class="pills-row-5" id="glitchPresetsRow"></div>

          <div class="custom-glitch-box" id="customGlitchBox">
            <div class="custom-glitch-controls">
              <input type="number" id="customGlitchValue" class="glitch-num-input" min="1" max="9999" value="30">
              <select id="customGlitchUnit" class="glitch-unit-select">
                <option value="seconds" id="unitSecondsOpt">ثواني</option>
                <option value="minutes" id="unitMinutesOpt">دقائق</option>
              </select>
              <button type="button" id="applyCustomGlitchBtn" class="glitch-apply-btn">تطبيق</button>
            </div>
          </div>
        </div>

        <div class="drawer-divider"></div>

        <!-- 4. Language -->
        <div class="drawer-section">
          <div class="drawer-section-title" id="menuLangTitle">اللغة</div>
          <div class="lang-pair-row">
            <button type="button" class="lang-choice-btn" id="langArBtn">العربية</button>
            <button type="button" class="lang-choice-btn" id="langEnBtn">English</button>
          </div>
        </div>

        <div class="drawer-divider"></div>

        <!-- 5. Share App + Backup Export/Import -->
        <div class="drawer-section">
          <button type="button" class="drawer-action-btn" id="shareAppBtn">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
            <span id="shareAppBtnText">مشاركة التطبيق</span>
          </button>

          <div class="backup-row">
            <button type="button" class="drawer-action-btn" id="exportBackupBtn">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span id="exportBackupText">تصدير نسخة احتياطية</span>
            </button>
            <button type="button" class="drawer-action-btn" id="importBackupBtn">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span id="importBackupText">استعادة</span>
            </button>
          </div>
          <input type="file" id="importBackupFileInput" accept=".json,.txt,application/json,text/plain" class="sr-only">
          <div class="backup-status-msg" id="backupStatusMsg"></div>
        </div>

        <!-- 6. Sidebar Footer: Developer Identity & Version Badge -->
        <div class="drawer-footer" id="drawerFooter">
          <span class="drawer-dev-label" id="drawerDevLabel" dir="auto">تطوير MiniDev <span class="drawer-emoji-iso">🧑🏻‍💻</span></span>
          <span class="drawer-version-badge" id="drawerVersionBadge" dir="ltr">v2.2.11</span>
        </div>
      </div>
    </div>

    <!-- End Group: One-Tap Slot Selector [1 | 2 | 3] + Task Hub Button -->
    <div class="top-end-group">
      <div class="one-tap-slots" role="group" id="slotSelector">
        <button type="button" class="slot-pill-btn active" data-slots="1">1</button>
        <button type="button" class="slot-pill-btn" data-slots="2">2</button>
        <button type="button" class="slot-pill-btn" data-slots="3">3</button>
      </div>

      <button type="button" id="openVaultBtn" class="vault-btn">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 15h6"/></svg>
        <span id="vaultBtnText">مستودع المهمات</span>
      </button>
    </div>
  </header>

  <!-- MAIN CALM FOCUS WORKSPACE -->
  <main class="focus-stage" id="focusStage" aria-live="polite"></main>

  <!-- TOP CALM TOAST BANNER WITH OPTIONAL UNDO BUTTON -->
  <div class="calm-toast" id="calmToast" role="status" aria-live="polite">
    <span class="calm-toast-msg" id="calmToastMsg"></span>
    <button type="button" class="toast-undo-btn" id="toastUndoBtn">تراجع ↩️</button>
  </div>

  <!-- V2.2.11 THEME-ADAPTIVE CROPPER MODAL (Cropper.js + Offline Canvas Fallback) -->
  <div class="modal-backdrop crop-backdrop" id="cropModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="cropTopTitle">
    <div class="wa-crop-shell" id="cropShell">
      <!-- Top Bar: Title Only -->
      <div class="crop-top-bar">
        <h3 class="crop-top-title" id="cropTopTitle">تعديل وقص الصورة</h3>
      </div>

      <!-- Stage: Locked Image + Movable/Resizable 1:1 Crop Box + Touch-Neutral Circular Ring -->
      <div class="wa-crop-stage" id="cropStage">
        <img id="cropSourceImg" alt="Crop source">
        <canvas id="cropFallbackCanvas"></canvas>
        <div class="crop-circle-guide" id="cropCircleGuide" aria-hidden="true"></div>
      </div>

      <!-- Bottom Control Panel: Single-Row Capsules (Rotate Right | Reset | Rotate Left) + Confirm/Cancel -->
      <div class="crop-bottom-panel">
        <div class="crop-capsules-row" id="cropCapsulesRow">
          <button type="button" class="crop-capsule-btn" id="rotateCropBtn" aria-label="Rotate right 90 degrees">
            <svg viewBox="0 0 24 24" width="17" height="17">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
              <polyline points="21 3 21 9 15 9"/>
            </svg>
            <span id="rotateRightBtnText">تدوير يمين</span>
          </button>
          <button type="button" class="crop-capsule-btn reset-pill-btn" id="resetCropBtn">إعادة ضبط</button>
          <button type="button" class="crop-capsule-btn" id="rotateLeftCropBtn" aria-label="Rotate left 90 degrees">
            <svg viewBox="0 0 24 24" width="17" height="17">
              <path d="M3 12a9 9 0 1 0 2.64-6.36"/>
              <polyline points="3 3 3 9 9 9"/>
            </svg>
            <span id="rotateLeftBtnText">تدوير يسار</span>
          </button>
        </div>

        <div class="crop-confirm-row">
          <button type="button" class="crop-confirm-btn" id="saveCropBtn">✓ تم</button>
          <button type="button" class="crop-cancel-btn" id="cancelCropBtn">إلغاء</button>
        </div>
      </div>
    </div>
  </div>

  <!-- EXPORT BACKUP FILENAME MODAL -->
  <div class="modal-backdrop sub-modal-backdrop" id="exportModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
    <div class="compact-modal" id="exportModalCard">
      <div class="vault-header">
        <h3 class="vault-title" id="exportModalTitle">تصدير نسخة احتياطية</h3>
        <button type="button" class="btn-close" id="closeExportModalBtn" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="export-body">
        <div class="form-row">
          <label class="form-label" for="exportFilenameInput" id="exportFilenameLabel">اسم ملف النسخة الاحتياطية</label>
          <div class="filename-input-group">
            <input type="text" id="exportFilenameInput" class="filename-field" dir="auto" autocomplete="off" value="nuqtat-tarkiz-tasks">
            <span class="filename-ext" dir="ltr">.json</span>
          </div>
        </div>

      /* =========================================
         2. STATE & STORAGE MANAGEMENT
         ========================================= */
      const STORAGE_KEY = 'focus_vault_app_v2_1';

      const defaultState = {
        theme: 'navy',
        lang: 'ar',
        slotCount: 1,
        glitchMode: 'off',
        glitchSeconds: 0,
        customGlitchValue: 30,
        customGlitchUnit: 'seconds',
        profileName: '',
        profileAvatar: '',
        slots: [null, null, null],
        activeAssignments: [null, null, null],
        restingSlots: [false, false, false],
        queue: [],
        completed: []
      };

      function normalizeCompletedList(list) {
        if (!Array.isArray(list)) return [];
        return list.map(item => {
          const log = Array.isArray(item.completionLog) && item.completionLog.length > 0
            ? item.completionLog.slice()
            : (item.completedAt ? [item.completedAt] : [new Date().toISOString()]);
          log.sort((a, b) => new Date(a).getTime() - new Date(b).getTime());
          return {
            ...item,
            completionLog: log,
            completedAt: log[log.length - 1]
          };
        });
      }

      function normalizeQueueList(list) {
        if (!Array.isArray(list)) return [];
        return list.map(item => ({
          ...item,
          completionLog: Array.isArray(item.completionLog) ? item.completionLog : []
        }));
      }

      function extractThreeSlots(parsed) {
        const hasActive = Array.isArray(parsed.activeAssignments) && parsed.activeAssignments.some(Boolean);
        const source = hasActive
          ? parsed.activeAssignments
          : (Array.isArray(parsed.slots) ? parsed.slots : [null, null, null]);
        return [
          typeof source[0] === 'string' ? source[0] : null,
          typeof source[1] === 'string' ? source[1] : null,
          typeof source[2] === 'string' ? source[2] : null
        ];
      }

      function normalizeParsedState(parsed) {
        if (!parsed || typeof parsed !== 'object') return structuredClone(defaultState);

        const mode = ['off', '1m', '2m', '5m', 'custom'].includes(parsed.glitchMode) ? parsed.glitchMode : 'off';
        let gSec = Number(parsed.glitchSeconds) || 0;
        if (mode === 'off') gSec = 0;
        else if (mode === '1m') gSec = 60;
        else if (mode === '2m') gSec = 120;
        else if (mode === '5m') gSec = 300;
        else if (mode === 'custom' && gSec <= 0) {
          const val = Math.max(1, Number(parsed.customGlitchValue) || 30);
          gSec = parsed.customGlitchUnit === 'minutes' ? val * 60 : val;
        }

        const safeAvatar = typeof parsed.profileAvatar === 'string' && parsed.profileAvatar.startsWith('data:image/')
          ? parsed.profileAvatar
          : '';

        const restoredSlotCount = [1, 2, 3].includes(Number(parsed.slotCount))
          ? Number(parsed.slotCount)
          : 1;

        const restoredSlots = extractThreeSlots(parsed);
        const rawResting = Array.isArray(parsed.restingSlots) ? parsed.restingSlots : [false, false, false];
        const restoredResting = [Boolean(rawResting[0]), Boolean(rawResting[1]), Boolean(rawResting[2])];

        return {
          theme: ['navy', 'dark', 'light', 'soft'].includes(parsed.theme) ? parsed.theme : 'navy',
          lang: parsed.lang === 'en' ? 'en' : 'ar',
          slotCount: restoredSlotCount,
          glitchMode: mode,
          glitchSeconds: gSec,
          customGlitchValue: Math.max(1, Number(parsed.customGlitchValue) || 30),
          customGlitchUnit: parsed.customGlitchUnit === 'minutes' ? 'minutes' : 'seconds',
          profileName: typeof parsed.profileName === 'string' ? parsed.profileName.slice(0, 32) : '',
          profileAvatar: safeAvatar,
          slots: restoredSlots.slice(),
          activeAssignments: restoredSlots.slice(),
          restingSlots: restoredResting,
          queue: normalizeQueueList(parsed.queue),
          completed: normalizeCompletedList(parsed.completed)
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY)
            || localStorage.getItem('focus_vault_app_v2')
            || localStorage.getItem('anti_overwhelm_focus_v1');
          if (!raw) return structuredClone(defaultState);
          return normalizeParsedState(JSON.parse(raw));
        } catch (err) {
          return structuredClone(defaultState);
        }
      }

      let state = loadState();
      let confirmClearHistory = false;
      let confirmRemoveAvatar = false;
      let pendingDeleteQueueId = null;
      let pendingDeleteCompletedId = null;
      let expandedHistoryIds = new Set();

      let undoToastTimer = null;

      let cropperInstance = null;
      let fallbackCropImage = null;
      let fallbackRotation = 0;
      let fallbackBox = { x: 0, y: 0, size: 180 };
      let fallbackBounds = { left: 0, top: 0, width: 240, height: 240 };
      let fallbackAction = null;
      let fallbackPointerStart = { x: 0, y: 0, box: null };

      function saveState() {
        try {
          const threeSlots = [
            state.slots[0] || null,
            state.slots[1] || null,
            state.slots[2] || null
          ];
          state.slots = threeSlots.slice();
          state.activeAssignments = threeSlots.slice();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          // Graceful fallback if storage quota is reached
        }
      }

      function t(key) {
        return I18N[state.lang][key] || key;
      }

      function generateId() {
        return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

         2B. SOFT THEME WELCOME SPLASH (MANUAL DISMISS ONLY)
         ========================================= */
      function dismissSoftWelcomeOverlay() {

        if (state.theme !== 'soft') return;

      /* =========================================
         3. DEADLINE & MANDATORY EVALUATION LOGIC
         ========================================= */
      function getTaskStatus(task) {
        let isUrgent = false;
        let isOverdue = false;

        if (task.deadline) {
          const dueTime = new Date(task.deadline).getTime();
          if (!isNaN(dueTime)) {
            const diff = dueTime - Date.now();
            if (diff <= 0) {
              isOverdue = true;
            } else if (diff <= 24 * 60 * 60 * 1000) {
              isUrgent = true;
            }
          }
        }

        const isTimedMandatory = isUrgent || isOverdue;
        const isMandatory = Boolean(task.manualMandatory) || isTimedMandatory;

        return {
          isMandatory,
          isTimedMandatory,
          isUrgent,
          isOverdue
        };
      }

      function formatDateTime(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return '';
        const locale = state.lang === 'ar' ? 'ar-EG' : 'en-US';
        return date.toLocaleString(locale, {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      /* =========================================
         4. THREE-SLOT PERSISTENCE & RENDER SLICING
         ========================================= */
      function compactAllThreeSlots() {
        const activeIds = [];
        for (let i = 0; i < 3; i++) {
          if (state.slots[i]) {
            activeIds.push(state.slots[i]);
          }
        }

        for (let i = 0; i < 3; i++) {
          if (i < activeIds.length) {
            state.slots[i] = activeIds[i];
            state.restingSlots[i] = false;
          } else {
            state.slots[i] = null;
          }
        }
      }

      function syncFocusSlots() {
        const queueMap = new Map(state.queue.map(item => [item.id, item]));

        for (let i = 0; i < 3; i++) {
          if (state.slots[i] && !queueMap.has(state.slots[i])) {
            state.slots[i] = null;
          }
        }

        const seen = new Set();
        for (let i = 0; i < 3; i++) {
          if (state.slots[i]) {
            if (seen.has(state.slots[i])) {
              state.slots[i] = null;
            } else {
              seen.add(state.slots[i]);
            }
          }
        }

        compactAllThreeSlots();
        saveState();
      }

      function syncFocusSlotsToQueueOrder() {
        const orderedQueueIds = state.queue.map(item => item.id);
        const availableSet = new Set(orderedQueueIds);

        for (let i = 0; i < 3; i++) {
          if (state.slots[i] && !availableSet.has(state.slots[i])) {
            state.slots[i] = null;
          }
        }

        const activeAssignments = [];
        for (let i = 0; i < 3; i++) {
          if (state.slots[i]) {
            activeAssignments.push({ slot: i, id: state.slots[i] });
          }
        }
        const sortedIds = activeAssignments
          .map(entry => entry.id)
          .sort((a, b) => orderedQueueIds.indexOf(a) - orderedQueueIds.indexOf(b));

        activeAssignments.forEach((entry, idx) => {
          state.slots[entry.slot] = sortedIds[idx];
        });

        saveState();
      }

      function nextCelebrationMessage() {
        const list = I18N[state.lang].completionCelebrations || [];
        if (list.length === 0) return t('completedMsg');
        let idx = Math.floor(Math.random() * list.length);
        if (list.length > 1 && idx === lastCelebrationIndex) {
          idx = (idx + 1) % list.length;
        }
        lastCelebrationIndex = idx;
        return list[idx];
      }

      function completeSlotTask(slotIndex) {
        const taskId = state.slots[slotIndex];
        if (!taskId) return;

        openReorderSlot = null;
        const nowIso = new Date().toISOString();
        const idx = state.queue.findIndex(item => item.id === taskId);
        if (idx === -1) return;

        const prevSlots = state.slots.slice();
        const prevResting = state.restingSlots.slice();
        const [task] = state.queue.splice(idx, 1);
        const existingLog = Array.isArray(task.completionLog) ? task.completionLog.slice() : [];
        existingLog.push(nowIso);
        existingLog.sort((a, b) => new Date(a).getTime() - new Date(b).getTime());

        const completedEntry = {
          ...task,
          completedAt: existingLog[existingLog.length - 1],
          completionLog: existingLog
        };
        state.completed.unshift(completedEntry);

        state.slots[slotIndex] = null;
        state.restingSlots[slotIndex] = true;
        compactAllThreeSlots();
        saveState();
        renderAll(true);
        restartGlitchTimer();

        const message = nextCelebrationMessage();
        showCalmToast(message, () => {
          const compIdx = state.completed.findIndex(c => c.id === task.id && c.completedAt === completedEntry.completedAt);
          if (compIdx !== -1) {
            state.completed.splice(compIdx, 1);
          }
          const restoredTask = {
            ...task,
            completionLog: existingLog.slice(0, -1)
          };
          const insertAt = Math.min(idx, state.queue.length);
          state.queue.splice(insertAt, 0, restoredTask);
          state.slots = prevSlots.slice();
          state.restingSlots = prevResting.slice();
          syncFocusSlots();
          renderAll(false);
          showCalmToast(t('restoredToQueueToast'));
        });
      }

      function pullNextForSlot(slotIndex) {
        openReorderSlot = null;
        const activeIds = new Set(state.slots.filter(Boolean));
        const nextTask = state.queue.find(item => !activeIds.has(item.id));
        if (nextTask) {
          state.slots[slotIndex] = nextTask.id;
        } else {
          state.slots[slotIndex] = null;
        }
        state.restingSlots[slotIndex] = false;
        compactAllThreeSlots();
        saveState();
        renderAll(true);
        restartGlitchTimer();
      }

      function deferSlotTask(slotIndex) {
        const taskId = state.slots[slotIndex];
        if (!taskId) return;

        const idx = state.queue.findIndex(item => item.id === taskId);
        if (idx === -1) return;

        const task = state.queue[idx];
        if (getTaskStatus(task).isMandatory) return;

        openReorderSlot = null;
        const snapshotQueue = state.queue.map(item => ({ ...item, completionLog: (item.completionLog || []).slice() }));
        const snapshotSlots = state.slots.slice();
        const snapshotResting = state.restingSlots.slice();

        state.queue.splice(idx, 1);
        state.queue.push(task);

        state.slots[slotIndex] = null;
        state.restingSlots[slotIndex] = false;
        syncFocusSlots();
        pullNextForSlot(slotIndex);

        showCalmToast(t('taskDeferredToast'), () => {
          state.queue = snapshotQueue;
          state.slots = snapshotSlots;
          state.restingSlots = snapshotResting;
          syncFocusSlots();
          renderAll(false);
          showCalmToast(t('restoredToQueueToast'));
        });
      }

      function swapFocusSlotPositions(fromSlot, toSlot) {
        if (fromSlot === toSlot || fromSlot < 0 || toSlot < 0 || fromSlot >= state.slotCount || toSlot >= state.slotCount) {
          openReorderSlot = null;
          renderFocusStage(false);
          return;
        }

        const tempId = state.slots[fromSlot];
        const tempRest = state.restingSlots[fromSlot];
        state.slots[fromSlot] = state.slots[toSlot];
        state.restingSlots[fromSlot] = state.restingSlots[toSlot];
        state.slots[toSlot] = tempId;
        state.restingSlots[toSlot] = tempRest;

        compactAllThreeSlots();

        const assignedIds = state.slots.filter(Boolean);
        const assignedTasks = assignedIds
          .map(id => state.queue.find(tItem => tItem.id === id))
          .filter(Boolean);
        const remainingTasks = state.queue.filter(tItem => !assignedIds.includes(tItem.id));
        state.queue = [...assignedTasks, ...remainingTasks];

        openReorderSlot = null;
        saveState();
        renderAll(true);
      }

      const openLayerStack = [];
      let suppressingPopstateClose = false;

      function pushLayerHistory(layerName) {
        if (openLayerStack[openLayerStack.length - 1] === layerName) return;
        openLayerStack.push(layerName);
        try {
          window.history.pushState(
            { nuqtatLayer: layerName, depth: openLayerStack.length },
            '',
            window.location.href
          );
        } catch (_) {}
      }

      function popLayerHistorySilent(layerName) {
        const idx = openLayerStack.lastIndexOf(layerName);
        if (idx === -1) return;
        const stepsAbove = openLayerStack.length - idx;
        openLayerStack.splice(idx);
        if (stepsAbove > 0 && window.history && typeof window.history.go === 'function') {
          suppressingPopstateClose = true;
          try {
            window.history.go(-stepsAbove);
          } catch (_) {
            suppressingPopstateClose = false;
          }
          setTimeout(() => {
            suppressingPopstateClose = false;
          }, 80);
        }
      }

      function applyTopLayerCloseOnly(layerName) {
        if (layerName === 'crop') {
          closeCropModalOnly(true);
        } else if (layerName === 'export') {
          closeExportBackupModal(true);
        } else if (layerName === 'vault') {
          closeVaultModal(true);
        } else if (layerName === 'drawer') {
          closeDrawerMenu(true);
        }
      }

      window.addEventListener('popstate', () => {
        if (suppressingPopstateClose) {
          suppressingPopstateClose = false;
          return;
        }
        if (openLayerStack.length > 0) {
          const topLayer = openLayerStack.pop();
          applyTopLayerCloseOnly(topLayer);
        }
      });

        if (pendingUndoAction) {

        } else {
