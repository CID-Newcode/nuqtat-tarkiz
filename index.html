<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="navy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>نقطة تركيز | Nuqtat Tarkiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    /* =========================================
       1. CSS VARIABLES & 3 BUILT-IN THEMES
       ========================================= */
    :root,
    [data-theme="navy"] {
      --bg-primary: #0b1320;
      --bg-card: #131e30;
      --bg-elevated: #19273e;
      --bg-input: #0e1828;
      --border-color: #1f304a;
      --border-focus: #38bdf8;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-text: #082f49;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.14);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.45);
      --shadow-dropdown: 0 14px 34px -6px rgba(0, 0, 0, 0.65);
      --overlay-bg: rgba(5, 9, 17, 0.78);
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-card: #121212;
      --bg-elevated: #1c1c1c;
      --bg-input: #0a0a0a;
      --border-color: #262626;
      --border-focus: #60a5fa;
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --text-muted: #737373;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --accent-text: #0a0a0a;
      --accent-glow: rgba(96, 165, 250, 0.35);
      --success: #4ade80;
      --success-bg: rgba(74, 222, 128, 0.14);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.85);
      --shadow-dropdown: 0 14px 34px -6px rgba(0, 0, 0, 0.9);
      --overlay-bg: rgba(0, 0, 0, 0.85);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --bg-elevated: #f1f5f9;
      --bg-input: #f8fafc;
      --border-color: #e2e8f0;
      --border-focus: #0284c7;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-text: #ffffff;
      --accent-glow: rgba(2, 132, 199, 0.28);
      --success: #16a34a;
      --success-bg: rgba(22, 163, 74, 0.12);
      --danger: #dc2626;
      --danger-bg: rgba(220, 38, 38, 0.1);
      --warning: #d97706;
      --warning-bg: rgba(217, 119, 6, 0.12);
      --shadow-card: 0 10px 28px -6px rgba(15, 23, 42, 0.08);
      --shadow-dropdown: 0 14px 34px -6px rgba(15, 23, 42, 0.14);
      --overlay-bg: rgba(15, 23, 42, 0.55);
    }

    /* =========================================
       2. RESET & BASE STYLES
       ========================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Arabic", sans-serif;
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    body.menu-scroll-locked {
      overflow: hidden !important;
      touch-action: none;
    }

    body.menu-scroll-locked .focus-stage {
      overflow: hidden !important;
      touch-action: none;
      pointer-events: none;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* =========================================
       3. SINGLE-ROW TOP BAR, BACKDROP & COMPACT MENU (☰)
       ========================================= */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 55;
    }

    .drawer-backdrop.open {
      display: block;
      animation: fadeIn 0.16s ease;
    }

    .top-bar {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0.65rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      position: relative;
      z-index: 60;
    }

    .top-end-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
      position: relative;
      z-index: 40;
    }

    .menu-trigger-wrap {
      position: relative;
      flex-shrink: 0;
      z-index: 65;
    }

    .hamburger-btn {
      width: 44px;
      height: 44px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 1.2rem;
      position: relative;
      z-index: 66;
    }

    .hamburger-btn:hover {
      border-color: var(--accent);
      background-color: var(--bg-elevated);
    }

    .hamburger-btn.is-open {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .status-dot {
      position: absolute;
      top: 7px;
      inset-inline-end: 7px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--accent);
      box-shadow: 0 0 0 2px var(--bg-card);
      display: none;
    }

    .hamburger-btn.has-alert .status-dot {
      display: block;
    }

    .one-tap-slots {
      display: inline-flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3px;
      height: 44px;
      flex-shrink: 0;
    }

    .slot-pill-btn {
      min-width: 34px;
      min-height: 36px;
      padding: 0 0.5rem;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .slot-pill-btn:hover {
      color: var(--text-primary);
    }

    .slot-pill-btn.active {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .vault-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0 0.9rem;
      font-size: 0.88rem;
      height: 44px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .vault-btn:hover {
      border-color: var(--accent);
      background-color: var(--bg-elevated);
    }

    /* Compact Single-Screen Drawer Menu */
    .drawer-menu {
      position: absolute;
      top: calc(100% + 8px);
      inset-inline-start: 0;
      width: min(334px, calc(100vw - 1.25rem));
      max-height: calc(100dvh - 72px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 0.55rem 0.65rem;
      box-shadow: var(--shadow-dropdown);
      display: none;
      flex-direction: column;
      gap: 0.42rem;
      z-index: 70;
    }

    .drawer-menu.open {
      display: flex;
      animation: dropReveal 0.16s ease;
    }

    @keyframes dropReveal {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .drawer-brand {
      padding: 0 0.25rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.4rem;
    }

    .drawer-brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .drawer-brand-subtitle {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .profile-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .profile-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.55rem;
      padding: 0.38rem 0.5rem;
      border-radius: 13px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      flex: 1;
    }

    .avatar-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--accent);
      color: var(--accent-text);
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--border-color);
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-name-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .profile-name-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.15rem 0.3rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-primary);
      outline: none;
      min-height: 36px;
      unicode-bidi: plaintext;
    }

    .profile-name-input:focus {
      background-color: var(--bg-input);
      border-color: var(--border-focus);
    }

    .profile-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .profile-mini-btn {
      min-width: 38px;
      min-height: 38px;
      padding: 0 0.45rem;
      border-radius: 10px;
      font-size: 0.76rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .profile-mini-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent);
    }

    .profile-mini-btn.remove-avatar:hover {
      color: var(--danger);
      border-color: var(--danger);
      background-color: var(--danger-bg);
    }

    .drawer-section {
      display: flex;
      flex-direction: column;
      gap: 0.24rem;
    }

    .drawer-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 0.25rem;
    }

    .drawer-divider {
      height: 1px;
      background-color: var(--border-color);
      margin: 0.02rem 0;
    }

    /* Horizontal Pill Rows for Themes & Visual Glitch */
    .pills-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.3rem;
    }

    .pills-row-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.25rem;
    }

    .pill-choice-btn {
      min-height: 38px;
      min-width: 0;
      padding: 0.25rem 0.25rem;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 600;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-choice-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent);
    }

    .pill-choice-btn.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
    }

    .lang-pair-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
    }

    .lang-choice-btn {
      min-height: 38px;
      border-radius: 10px;
      font-size: 0.82rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .lang-choice-btn.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .custom-glitch-box {
      margin-top: 0.15rem;
      padding: 0.45rem;
      border-radius: 11px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      display: none;
      flex-direction: column;
      gap: 0.35rem;
    }

    .custom-glitch-box.open {
      display: flex;
    }

    .custom-glitch-controls {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }

    .glitch-num-input {
      width: 74px;
      min-height: 40px;
      padding: 0.25rem 0.45rem;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .glitch-num-input:focus {
      border-color: var(--border-focus);
    }

    .glitch-unit-select {
      flex: 1;
      min-height: 40px;
      padding: 0.25rem 0.45rem;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
    }

    .glitch-apply-btn {
      min-height: 40px;
      padding: 0 0.65rem;
      border-radius: 9px;
      font-size: 0.8rem;
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .drawer-action-btn {
      width: 100%;
      min-height: 38px;
      padding: 0.35rem 0.55rem;
      border-radius: 10px;
      justify-content: flex-start;
      font-size: 0.8rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .drawer-action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .backup-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
    }

    .backup-status-msg {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.5rem;
      border-radius: 8px;
      background-color: var(--success-bg);
      color: var(--success);
      display: none;
      line-height: 1.35;
    }

    .backup-status-msg.error {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .backup-status-msg.visible {
      display: block;
    }

    @media (max-width: 420px) {
      .top-bar {
        padding: 0.65rem 0.65rem;
        gap: 0.35rem;
      }
      .top-end-group {
        gap: 0.35rem;
      }
      .slot-pill-btn {
        min-width: 30px;
        padding: 0 0.4rem;
        font-size: 0.84rem;
      }
      .vault-btn {
        padding: 0 0.72rem;
        font-size: 0.83rem;
      }
    }

    /* =========================================
       4. MAIN FOCUS STAGE & DOUBLE-BLINK GLITCH
       ========================================= */
    .focus-stage {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.15rem;
    }

    .focus-card {
      position: relative;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 1.85rem 1.65rem;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      transition: border-color 0.25s ease, background-color 0.25s ease;
      user-select: none;
    }

    .focus-card.animate-enter {
      animation: fadeSlideIn 0.24s ease;
    }

    .focus-card.is-mandatory {
      border-color: var(--warning);
    }

    .focus-card.is-overdue {
      border-color: var(--danger);
    }

    .focus-card.glitch-blink-sequence {
      animation: doubleBlinkGlitch 2.8s linear 1;
    }

    @keyframes doubleBlinkGlitch {
      0% { opacity: 1; }
      4% { opacity: 0; }
      29% { opacity: 0; }
      33% { opacity: 1; }
      51% { opacity: 1; }
      55% { opacity: 0; }
      80% { opacity: 0; }
      84% { opacity: 1; }
      100% { opacity: 1; }
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-reorder-popover {
      position: absolute;
      top: -18px;
      inset-inline-end: 1.25rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 0.3rem 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: var(--shadow-dropdown);
      z-index: 25;
      animation: dropReveal 0.16s ease;
    }

    .popover-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      padding-inline: 0.25rem;
    }

    .pos-choice-btn {
      min-width: 38px;
      min-height: 38px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .pos-choice-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pos-choice-btn.current-pos {
      background-color: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.72rem;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .badge-mandatory {
      background-color: var(--warning-bg);
      color: var(--warning);
    }

    .badge-deadline {
      background-color: var(--bg-elevated);
      color: var(--accent);
    }

    .badge-deadline.urgent {
      background-color: var(--warning-bg);
      color: var(--warning);
    }

    .badge-deadline.overdue {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .task-title {
      font-size: clamp(1.3rem, 3.4vw, 1.8rem);
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-primary);
      word-break: break-word;
      unicode-bidi: plaintext;
    }

    .task-note {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.65;
      white-space: pre-line;
      word-break: break-word;
      unicode-bidi: plaintext;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.35rem;
      flex-wrap: wrap;
    }

    .btn-done {
      flex: 1;
      min-width: 140px;
      background-color: var(--accent);
      color: var(--accent-text);
      font-size: 0.98rem;
      padding: 0.75rem 1.25rem;
      border-radius: 14px;
    }

    .btn-done:hover {
      background-color: var(--accent-hover);
    }

    .btn-defer {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.94rem;
      padding: 0.75rem 1.15rem;
      border-radius: 14px;
    }

    .btn-defer:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .rest-card {
      background-color: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 22px;
      padding: 2rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .rest-card.animate-enter {
      animation: fadeSlideIn 0.24s ease;
    }

    .rest-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: var(--success-bg);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rest-icon.empty-vault-icon {
      background-color: var(--bg-elevated);
      color: var(--accent);
    }

    .rest-message {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .rest-sub {
      font-size: 0.9rem;
      color: var(--text-secondary);
      max-width: 360px;
    }

    .btn-pull {
      background-color: var(--bg-elevated);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.7rem 1.45rem;
      font-size: 0.95rem;
      border-radius: 14px;
      margin-top: 0.2rem;
    }

    .btn-pull:hover {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    /* =========================================
       5. CALM TOAST BANNER
       ========================================= */
    .calm-toast {
      position: fixed;
      bottom: max(1.25rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 0.65rem 1.15rem;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--shadow-dropdown);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: calc(100vw - 2rem);
      text-align: center;
    }

    .calm-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================================
       6. MODALS, CROPPER.JS WHATSAPP CROPPER & EXPORT
       ========================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--overlay-bg);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0.85rem;
      padding-top: max(0.85rem, env(safe-area-inset-top));
      padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
      z-index: 100;
    }

    .modal-backdrop.sub-modal-backdrop {
      z-index: 120;
    }

    .modal-backdrop.crop-backdrop {
      background-color: #000000;
      padding: 0;
      z-index: 130;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .vault-modal {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 680px;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .compact-modal {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 410px;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .vault-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .vault-title {
      font-size: 1.12rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-close {
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
      border-radius: 12px;
    }

    .btn-close:hover {
      color: var(--text-primary);
    }

    /* WhatsApp-Style Full-Screen Cropper with Cropper.js + Offline Fallback */
    .wa-crop-shell {
      width: 100vw;
      height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(0.75rem, env(safe-area-inset-top));
      padding-bottom: max(0.9rem, env(safe-area-inset-bottom));
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      user-select: none;
      overflow: hidden;
    }

    .wa-crop-stage {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #000000;
    }

    .wa-crop-stage img#cropSourceImg {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .wa-crop-stage canvas#cropFallbackCanvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      display: none;
    }

    .wa-crop-stage .cropper-bg {
      background: #000000 !important;
    }

    .wa-crop-stage .cropper-modal {
      background-color: rgba(0, 0, 0, 0.62);
    }

    .wa-crop-stage .cropper-view-box {
      outline: 1.5px solid rgba(255, 255, 255, 0.9);
      outline-offset: 0;
    }

    .wa-crop-stage .cropper-dashed {
      border-color: rgba(255, 255, 255, 0.45);
    }

    .wa-crop-stage .cropper-line {
      background-color: rgba(255, 255, 255, 0.35);
    }

    .wa-crop-stage .cropper-point {
      width: 14px !important;
      height: 14px !important;
      background-color: #ffffff !important;
      border-radius: 2px !important;
      opacity: 1 !important;
    }

    .wa-crop-stage .cropper-point.point-n,
    .wa-crop-stage .cropper-point.point-s {
      width: 18px !important;
      height: 4px !important;
      opacity: 0.7 !important;
    }

    .wa-crop-stage .cropper-point.point-e,
    .wa-crop-stage .cropper-point.point-w {
      width: 4px !important;
      height: 18px !important;
      opacity: 0.7 !important;
    }

    .wa-crop-footer {
      width: 100%;
      padding: 0.75rem 1.25rem 0.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background-color: #000000;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .wa-footer-btn {
      min-height: 44px;
      padding: 0 0.85rem;
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 700;
      color: #ffffff;
      background: transparent;
    }

    .wa-footer-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .wa-footer-btn.done-btn {
      color: #38bdf8;
    }

    .wa-rotate-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .wa-rotate-btn:hover {
      background-color: rgba(255, 255, 255, 0.22);
    }

    /* Export Backup Modal Body */
    .export-body {
      padding: 1.15rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }

    .filename-input-group {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--bg-input);
      overflow: hidden;
    }

    .filename-input-group:focus-within {
      border-color: var(--border-focus);
    }

    .filename-field {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0.55rem 0.8rem;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      unicode-bidi: plaintext;
    }

    .filename-ext {
      display: inline-flex;
      align-items: center;
      padding: 0 0.75rem;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-muted);
      background-color: var(--bg-elevated);
      border-inline-start: 1px solid var(--border-color);
      user-select: none;
      direction: ltr;
      unicode-bidi: isolate;
    }

    /* Vault Tabs */
    .vault-tabs {
      display: flex;
      padding: 0.6rem 1.25rem 0;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-primary);
    }

    .tab-btn {
      flex: 1;
      border-radius: 12px 12px 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      color: var(--text-secondary);
      font-size: 0.92rem;
      padding: 0.6rem 0.9rem;
      position: relative;
      bottom: -1px;
    }

    .tab-btn.active {
      background-color: var(--bg-card);
      border-color: var(--border-color);
      color: var(--accent);
    }

    .tab-count {
      font-size: 0.76rem;
      padding: 0.1rem 0.48rem;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .tab-btn.active .tab-count {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .vault-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.15rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      overscroll-behavior: contain;
    }

    .task-form {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      align-items: end;
    }

    .form-label {
      font-size: 0.81rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-input {
      width: 100%;
      min-height: 44px;
      padding: 0.58rem 0.8rem;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease;
      unicode-bidi: plaintext;
    }

    .form-input:focus {
      border-color: var(--border-focus);
    }

    .toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 0.5rem 0.8rem;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      cursor: pointer;
      user-select: none;
    }

    .toggle-label-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .switch-track {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background-color: var(--border-color);
      position: relative;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .switch-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #ffffff;
      position: absolute;
      top: 3px;
      inset-inline-start: 3px;
      transition: transform 0.2s ease;
    }

    input[type="checkbox"]:checked + .switch-track {
      background-color: var(--warning);
    }

    [dir="rtl"] input[type="checkbox"]:checked + .switch-track .switch-thumb {
      transform: translateX(-20px);
    }

    [dir="ltr"] input[type="checkbox"]:checked + .switch-track .switch-thumb {
      transform: translateX(20px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .form-actions {
      display: flex;
      gap: 0.55rem;
      justify-content: flex-end;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
      padding: 0 1.2rem;
      font-size: 0.92rem;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0 0.95rem;
      font-size: 0.88rem;
    }

    .btn-secondary:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: relative;
      border-radius: 14px;
    }

    .list-item {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 0.72rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      transition: border-color 0.2s ease, background-color 0.2s ease;
      user-select: none;
      position: relative;
    }

    .list-item.is-active-slot {
      border-inline-start: 3px solid var(--accent);
    }

    .sortable-ghost-calm {
      opacity: 0.45;
      background-color: var(--bg-elevated) !important;
      border: 1px dashed var(--accent) !important;
    }

    .sortable-chosen-calm {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.4);
    }

    .drag-handle {
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: grab;
      touch-action: none;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .drag-handle:active {
      cursor: grabbing;
      color: var(--accent);
      background-color: var(--bg-elevated);
    }

    .item-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .item-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-word;
      unicode-bidi: plaintext;
    }

    .item-note {
      font-size: 0.83rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      unicode-bidi: plaintext;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.38rem;
      margin-top: 0.12rem;
    }

    .mini-tag {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.16rem 0.52rem;
      border-radius: 6px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .mini-tag.active-tag {
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .mini-tag.mandatory-tag {
      background-color: var(--warning-bg);
      color: var(--warning);
    }

    .mini-tag.overdue-tag {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .repeat-badge-btn {
      min-height: 28px;
      min-width: auto;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      background-color: var(--success-bg);
      color: var(--success);
      border: 1px solid transparent;
    }

    .repeat-badge-btn:hover {
      border-color: var(--success);
    }

    .history-drawer {
      margin-top: 0.45rem;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .history-drawer-title {
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.1rem;
    }

    .history-entry {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      flex-shrink: 0;
    }

    .ctrl-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 10px;
      color: var(--text-secondary);
      background-color: transparent;
    }

    .ctrl-btn:hover:not(:disabled) {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .ctrl-btn:disabled {
      opacity: 0.26;
      cursor: not-allowed;
    }

    .ctrl-btn.danger:hover {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .completed-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .btn-clear-history {
      background-color: var(--danger-bg);
      color: var(--danger);
      padding: 0 0.9rem;
      font-size: 0.84rem;
      margin-inline-start: auto;
    }

    .confirm-bar {
      width: 100%;
      background-color: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: 12px;
      padding: 0.65rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      flex-wrap: wrap;
      font-size: 0.86rem;
    }

    .empty-list-msg {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    @media (max-width: 600px) {
      .focus-stage {
        padding: 1rem 0.85rem 2rem;
      }

      .focus-card {
        padding: 1.45rem 1.2rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .list-item {
        flex-wrap: wrap;
      }

      .item-controls {
        width: 100%;
        justify-content: flex-end;
        border-top: 1px solid var(--border-color);
        padding-top: 0.35rem;
        margin-top: 0.15rem;
      }
    }
  </style>

        { id: 'light', labelKey: 'themeLight' },
        { id: 'dark', labelKey: 'themeDark' },
        { id: 'navy', labelKey: 'themeMidnight' }
      ];

      const GLITCH_PRESETS = [
        { id: 'off', seconds: 0, labelKey: 'glitchOff' },
        { id: '1m', seconds: 60, labelKey: 'glitch1m' },
        { id: '2m', seconds: 120, labelKey: 'glitch2m' },
        { id: '5m', seconds: 300, labelKey: 'glitch5m' }
      ];

      /* =========================================
         2. STATE & STORAGE MANAGEMENT
         ========================================= */
      const STORAGE_KEY = 'focus_vault_app_v2_1';

      const defaultState = {
        theme: 'navy',
        lang: 'ar',
        slotCount: 1,
        glitchMode: 'off',
        glitchSeconds: 0,
        customGlitchValue: 30,
        customGlitchUnit: 'seconds',
        profileName: '',
        profileAvatar: '',
        slots: [null, null, null],
        activeAssignments: [null, null, null],
        restingSlots: [false, false, false],
        queue: [],
        completed: []
      };

      function normalizeCompletedList(list) {
        if (!Array.isArray(list)) return [];
        return list.map(item => {
          const log = Array.isArray(item.completionLog) && item.completionLog.length > 0
            ? item.completionLog.slice()
            : (item.completedAt ? [item.completedAt] : [new Date().toISOString()]);
          log.sort((a, b) => new Date(a).getTime() - new Date(b).getTime());
          return {
            ...item,
            completionLog: log,
            completedAt: log[log.length - 1]
          };
        });
      }

      function normalizeQueueList(list) {
        if (!Array.isArray(list)) return [];
        return list.map(item => ({
          ...item,
          completionLog: Array.isArray(item.completionLog) ? item.completionLog : []
        }));
      }

      function extractThreeSlots(parsed) {
        const hasActive = Array.isArray(parsed.activeAssignments) && parsed.activeAssignments.some(Boolean);
        const source = hasActive
          ? parsed.activeAssignments
          : (Array.isArray(parsed.slots) ? parsed.slots : [null, null, null]);
        return [
          typeof source[0] === 'string' ? source[0] : null,
          typeof source[1] === 'string' ? source[1] : null,
          typeof source[2] === 'string' ? source[2] : null
        ];
      }

      function normalizeParsedState(parsed) {
        if (!parsed || typeof parsed !== 'object') return structuredClone(defaultState);

        const mode = ['off', '1m', '2m', '5m', 'custom'].includes(parsed.glitchMode) ? parsed.glitchMode : 'off';
        let gSec = Number(parsed.glitchSeconds) || 0;
        if (mode === 'off') gSec = 0;
        else if (mode === '1m') gSec = 60;
        else if (mode === '2m') gSec = 120;
        else if (mode === '5m') gSec = 300;
        else if (mode === 'custom' && gSec <= 0) {
          const val = Math.max(1, Number(parsed.customGlitchValue) || 30);
          gSec = parsed.customGlitchUnit === 'minutes' ? val * 60 : val;
        }

        const safeAvatar = typeof parsed.profileAvatar === 'string' && parsed.profileAvatar.startsWith('data:image/')
          ? parsed.profileAvatar
          : '';

        const restoredSlotCount = [1, 2, 3].includes(Number(parsed.slotCount))
          ? Number(parsed.slotCount)
          : 1;

        // Preserve all 3 slots [slot0, slot1, slot2] intact regardless of slotCount
        const restoredSlots = extractThreeSlots(parsed);
        const rawResting = Array.isArray(parsed.restingSlots) ? parsed.restingSlots : [false, false, false];
        const restoredResting = [Boolean(rawResting[0]), Boolean(rawResting[1]), Boolean(rawResting[2])];

        return {
          theme: ['navy', 'dark', 'light'].includes(parsed.theme) ? parsed.theme : 'navy',
          lang: parsed.lang === 'en' ? 'en' : 'ar',
          slotCount: restoredSlotCount,
          glitchMode: mode,
          glitchSeconds: gSec,
          customGlitchValue: Math.max(1, Number(parsed.customGlitchValue) || 30),
          customGlitchUnit: parsed.customGlitchUnit === 'minutes' ? 'minutes' : 'seconds',
          profileName: typeof parsed.profileName === 'string' ? parsed.profileName.slice(0, 32) : '',
          profileAvatar: safeAvatar,
          slots: restoredSlots.slice(),
          activeAssignments: restoredSlots.slice(),
          restingSlots: restoredResting,
          queue: normalizeQueueList(parsed.queue),
          completed: normalizeCompletedList(parsed.completed)
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY)
            || localStorage.getItem('focus_vault_app_v2')
            || localStorage.getItem('anti_overwhelm_focus_v1');
          if (!raw) return structuredClone(defaultState);
          return normalizeParsedState(JSON.parse(raw));
        } catch (err) {
          return structuredClone(defaultState);
        }
      }

      let state = loadState();
      let confirmClearHistory = false;
      let confirmRemoveAvatar = false;
      let pendingDeleteQueueId = null;
      let pendingDeleteCompletedId = null;
      let expandedHistoryIds = new Set();
      let openReorderSlot = null;
      let customBoxOpen = state.glitchMode === 'custom';
      let glitchIntervalTimer = null;
      let queueSortableInstance = null;
      let backupStatusTimeout = null;
      let toastTimer = null;

      /* Cropper.js + Offline Fallback state */
      let cropperInstance = null;
      let fallbackCropImage = null;

      function saveState() {
        try {
          const threeSlots = [
            state.slots[0] || null,
            state.slots[1] || null,
            state.slots[2] || null
          ];
          state.slots = threeSlots.slice();
          state.activeAssignments = threeSlots.slice();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          // Graceful fallback if storage quota is reached
        }
      }

      function t(key) {
        return I18N[state.lang][key] || key;
      }

      function generateId() {
        return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      /* =========================================
         3. DEADLINE & MANDATORY EVALUATION LOGIC
         ========================================= */
      function getTaskStatus(task) {
        let isUrgent = false;
        let isOverdue = false;

        if (task.deadline) {
          const dueTime = new Date(task.deadline).getTime();
          if (!isNaN(dueTime)) {
            const diff = dueTime - Date.now();
            if (diff <= 0) {
              isOverdue = true;
            } else if (diff <= 24 * 60 * 60 * 1000) {
              isUrgent = true;
            }
          }
        }

        const isTimedMandatory = isUrgent || isOverdue;
        const isMandatory = Boolean(task.manualMandatory) || isTimedMandatory;

        return {
          isMandatory,
          isTimedMandatory,
          isUrgent,
          isOverdue
        };
      }

      function formatDateTime(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return '';
        const locale = state.lang === 'ar' ? 'ar-EG' : 'en-US';
        return date.toLocaleString(locale, {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      /* =========================================
         4. THREE-SLOT PERSISTENCE & RENDER SLICING
         ========================================= */
      // Operates strictly on all 3 slots [0, 1, 2] without truncating to slotCount
      function compactAllThreeSlots() {
        const activeIds = [];
        for (let i = 0; i < 3; i++) {
          if (state.slots[i]) {
            activeIds.push(state.slots[i]);
          }
        }

        for (let i = 0; i < 3; i++) {
          if (i < activeIds.length) {
            state.slots[i] = activeIds[i];
            state.restingSlots[i] = false;
          } else {
            state.slots[i] = null;
          }
        }
      }

      function syncFocusSlots() {
        const queueMap = new Map(state.queue.map(item => [item.id, item]));

        for (let i = 0; i < 3; i++) {
          if (state.slots[i] && !queueMap.has(state.slots[i])) {
            state.slots[i] = null;
          }
        }

        const seen = new Set();
        for (let i = 0; i < 3; i++) {
          if (state.slots[i]) {
            if (seen.has(state.slots[i])) {
              state.slots[i] = null;
            } else {
              seen.add(state.slots[i]);
            }
          }
        }

        compactAllThreeSlots();
        saveState();
      }

      function syncFocusSlotsToQueueOrder() {
        const orderedQueueIds = state.queue.map(item => item.id);
        const availableSet = new Set(orderedQueueIds);

        for (let i = 0; i < 3; i++) {
          if (state.slots[i] && !availableSet.has(state.slots[i])) {
            state.slots[i] = null;
          }
        }

        const activeAssignments = [];
        for (let i = 0; i < 3; i++) {
          if (state.slots[i]) {
            activeAssignments.push({ slot: i, id: state.slots[i] });
          }
        }
        const sortedIds = activeAssignments
          .map(entry => entry.id)
          .sort((a, b) => orderedQueueIds.indexOf(a) - orderedQueueIds.indexOf(b));

        activeAssignments.forEach((entry, idx) => {
          state.slots[entry.slot] = sortedIds[idx];
        });

        saveState();
      }

      function completeSlotTask(slotIndex) {
        const taskId = state.slots[slotIndex];
        if (!taskId) return;

        openReorderSlot = null;
        const nowIso = new Date().toISOString();
        const idx = state.queue.findIndex(item => item.id === taskId);

        if (idx !== -1) {
          const [task] = state.queue.splice(idx, 1);
          const existingLog = Array.isArray(task.completionLog) ? task.completionLog.slice() : [];
          existingLog.push(nowIso);
          existingLog.sort((a, b) => new Date(a).getTime() - new Date(b).getTime());

          state.completed.unshift({
            ...task,
            completedAt: existingLog[existingLog.length - 1],
            completionLog: existingLog
          });
        }

        state.slots[slotIndex] = null;
        state.restingSlots[slotIndex] = true;
        compactAllThreeSlots();
        saveState();
        renderAll(true);
        restartGlitchTimer();
      }

      function pullNextForSlot(slotIndex) {
        openReorderSlot = null;
        const activeIds = new Set(state.slots.filter(Boolean));
        const nextTask = state.queue.find(item => !activeIds.has(item.id));
        if (nextTask) {
          state.slots[slotIndex] = nextTask.id;
        } else {
          state.slots[slotIndex] = null;
        }
        state.restingSlots[slotIndex] = false;
        compactAllThreeSlots();
        saveState();
        renderAll(true);
        restartGlitchTimer();
      }

      function deferSlotTask(slotIndex) {
        const taskId = state.slots[slotIndex];
        if (!taskId) return;

        const idx = state.queue.findIndex(item => item.id === taskId);
        if (idx === -1) return;

        const task = state.queue[idx];
        if (getTaskStatus(task).isMandatory) return;

        openReorderSlot = null;
        state.queue.splice(idx, 1);
        state.queue.push(task);

        state.slots[slotIndex] = null;
        state.restingSlots[slotIndex] = false;
        syncFocusSlots();
        pullNextForSlot(slotIndex);
      }

      function swapFocusSlotPositions(fromSlot, toSlot) {
        if (fromSlot === toSlot || fromSlot < 0 || toSlot < 0 || fromSlot >= state.slotCount || toSlot >= state.slotCount) {
          openReorderSlot = null;
          renderFocusStage(false);
          return;
        }

        const tempId = state.slots[fromSlot];
        const tempRest = state.restingSlots[fromSlot];
        state.slots[fromSlot] = state.slots[toSlot];
        state.restingSlots[fromSlot] = state.restingSlots[toSlot];
        state.slots[toSlot] = tempId;
        state.restingSlots[toSlot] = tempRest;

        compactAllThreeSlots();

        const assignedIds = state.slots.filter(Boolean);
        const assignedTasks = assignedIds
          .map(id => state.queue.find(tItem => tItem.id === id))
          .filter(Boolean);
        const remainingTasks = state.queue.filter(tItem => !assignedIds.includes(tItem.id));
        state.queue = [...assignedTasks, ...remainingTasks];

        openReorderSlot = null;
        saveState();
        renderAll(true);
      }

         ========================================= */
      function triggerDoubleBlinkInPlace() {
        if (els.vaultBackdrop.classList.contains('open')) return;
        const cards = els.focusStage.querySelectorAll('.focus-card');
        if (cards.length === 0) return;

        cards.forEach(card => {

        });

      function restartGlitchTimer() {
        if (glitchIntervalTimer) {
          clearInterval(glitchIntervalTimer);
          glitchIntervalTimer = null;
        }
        if (state.glitchMode === 'off' || !state.glitchSeconds || state.glitchSeconds <= 0) {
          return;
        }

        glitchIntervalTimer = setInterval(() => {
          triggerDoubleBlinkInPlace();
        }, state.glitchSeconds * 1000);
      }

      function destroyCropperInstance() {

      function renderOfflineCenterCropPreview() {
        if (!fallbackCropImage) return;
        const canvas = els.cropFallbackCanvas;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const side = Math.min(fallbackCropImage.naturalWidth, fallbackCropImage.naturalHeight);
        const sx = Math.floor((fallbackCropImage.naturalWidth - side) / 2);
        const sy = Math.floor((fallbackCropImage.naturalHeight - side) / 2);

        const previewSize = Math.min(320, Math.max(200, Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.68)));
        canvas.width = previewSize;
        canvas.height = previewSize;
        ctx.clearRect(0, 0, previewSize, previewSize);
        ctx.drawImage(fallbackCropImage, sx, sy, side, side, 0, 0, previewSize, previewSize);
      }

      function rotateCropper90() {
        if (cropperInstance) {
          cropperInstance.rotate(90);
        } else if (fallbackCropImage) {
          const off = document.createElement('canvas');
          off.width = fallbackCropImage.naturalHeight;
          off.height = fallbackCropImage.naturalWidth;
          const octx = off.getContext('2d');
          if (octx) {
            octx.translate(off.width / 2, off.height / 2);
            octx.rotate(Math.PI / 2);
            octx.drawImage(fallbackCropImage, -fallbackCropImage.naturalWidth / 2, -fallbackCropImage.naturalHeight / 2);
            const rotatedImg = new Image();
            rotatedImg.onload = () => {
              fallbackCropImage = rotatedImg;
              renderOfflineCenterCropPreview();
            };
            rotatedImg.src = off.toDataURL('image/jpeg', 0.92);
          }
        }
      }

        if (fallbackCropImage) {

          const sx = Math.floor((fallbackCropImage.naturalWidth - side) / 2);
          const sy = Math.floor((fallbackCropImage.naturalHeight - side) / 2);

      async function copyUrlToClipboard(urlStr) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(urlStr);
          return true;
        }
        const helper = document.createElement('textarea');
        helper.value = urlStr;
        helper.style.position = 'fixed';
        helper.style.opacity = '0';
        document.body.appendChild(helper);
        helper.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(helper);
        return ok;
      }

      async function shareCurrentApp() {
        const isHttpOrigin = typeof window.location.protocol === 'string' && window.location.protocol.startsWith('http');

        if (isHttpOrigin) {
          const shareUrl = window.location.href;
          try {
            if (typeof navigator.share === 'function') {
              await navigator.share({
                title: t('drawerBrandTitle'),
                text: 'Nuqtat Tarkiz — Anti-Overwhelm Focus',
                url: shareUrl
              });
              showCalmToast(t('shareLinkSuccessMsg'));
              return;
            }
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }

          try {
            const copied = await copyUrlToClipboard(shareUrl);
            if (copied) {
              showCalmToast(t('shareLinkCopiedMsg'));
              return;
            }
          } catch (_) {}

          showBackupNotice(t('shareFailedMsg'), true);
          return;
        }

        try {
          const htmlContent = buildCleanAppHtml();
          const file = new File([htmlContent], 'nuqtat-tarkiz.html', { type: 'text/html' });

          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: t('drawerBrandTitle'),
              text: 'Anti-Overwhelm Focus',
              files: [file]
            });
            showBackupNotice(t('shareSuccessMsg'), false);
            return;
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }

        try {
          downloadCleanHtmlFile();
          showBackupNotice(t('shareFallbackDownloadedMsg'), false);
        } catch (_) {
          showBackupNotice(t('shareFailedMsg'), true);
        }
      }

                {
                  description: 'JSON Backup File',
                  accept: { 'application/json': ['.json'] }
                }
              ]
            });
            const writable = await handle.createWritable();
            await writable.write(jsonStr);
            await writable.close();
            showBackupNotice(t('exportSuccessMsg'), false);
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') {
              return;
            }
          }
        }

        triggerDirectJsonDownload(fileBaseName, jsonStr);
      }

      function importBackupFromFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onerror = () => showBackupNotice(t('importInvalidMsg'), true);
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            const rawData = parsed && typeof parsed === 'object' && parsed.data && typeof parsed.data === 'object'
              ? parsed.data
              : parsed;

            if (!rawData || typeof rawData !== 'object' || (!Array.isArray(rawData.queue) && !Array.isArray(rawData.completed) && !Array.isArray(rawData.slots) && !Array.isArray(rawData.activeAssignments))) {
              showBackupNotice(t('importInvalidMsg'), true);
              return;
            }

            state.queue = normalizeQueueList(rawData.queue);
            state.completed = normalizeCompletedList(rawData.completed);
            if ([1, 2, 3].includes(Number(rawData.slotCount))) {
              state.slotCount = Number(rawData.slotCount);
            }
            const importedSlots = extractThreeSlots(rawData);
            state.slots = importedSlots.slice();
            state.activeAssignments = importedSlots.slice();
            const rawResting = Array.isArray(rawData.restingSlots) ? rawData.restingSlots : [false, false, false];
            state.restingSlots = [Boolean(rawResting[0]), Boolean(rawResting[1]), Boolean(rawResting[2])];

            pendingDeleteQueueId = null;
            pendingDeleteCompletedId = null;
            confirmClearHistory = false;
            syncFocusSlots();
            renderAll(false);
            showBackupNotice(t('importSuccessMsg'), false);
          } catch (_) {
            showBackupNotice(t('importInvalidMsg'), true);
          }
        };
        reader.readAsText(file);
      }
